<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dodge on the TV</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&amp;family=Big+Shoulders+Stencil+Display:wght@900&amp;family=Courier+Prime:wght@400;700&amp;family=Special+Elite&amp;family=Permanent+Marker&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#020202}a{color:#ffb866}a:hover{color:#ffe2b8}</style>
</helmet>
<!--
  DODGE on the TV. moment = live | hit | dodged | flash.
  No mix-blend-mode anywhere: light is normal-blend translucent colour; the hit's black-and-white is a baked
  grey wall (brick-bw.png) cross-faded in by opacity, with the rest of the scene drawn from a grey palette.

  LIVE: rain (4 layers), 4 puddle ripples, lamp flicker, title flicker = 10 infinite loops.
  HIT (all transform/opacity, see componentDidMount):
    0ms     freeze: no ambient loop starts; the rain hangs still and the grey wall fades in (60ms)
    60ms    two-tone flash: moment=flash shows this frame (bone ground, black wedge with cream slivers), ~4 frames
    180ms   the red speed ribbons slide in from the throw side (only now does the TV show a direction)
    220ms   the faceted shuriken thunks into the polaroid (scale 2.2 -> 1), shards burst out
    200ms   the polaroid swings on its last piece of tape and settles by ~1900ms
    700ms   TO THE WHEEL slams on the clear wall top right
    1900ms  one loop only: the lamp breathes (opacity 1 <-> .88, 2.6s)
  DODGED:
    0ms     the polaroid snaps right; blue afterimages; rain at full speed (2 layers loop, far layers still)
    120ms   the shuriken whips in and bites the brick; 270ms spark
    600ms   the rain eases to a third of its speed; nothing else loops = 2 infinite loops
    750ms   MISSED is sprayed on
  The static board (motion=false / reduced motion) is the settled end frame.
  Nothing on this board ever names the thrower or their role.
-->
<div data-fx="root" style="width: 1920px; height: 1080px; position: relative; overflow: hidden; isolation: isolate; background: #050303; color: #f1e8d4; font-family: 'Courier Prime', monospace">

  <svg width="0" height="0" style="position: absolute" aria-hidden="true">
    <defs>
      <!-- the shuriken: four blades, each split into a lit and a shaded plane (light from the top left), and a raised ring -->
      <linearGradient id="dg-ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbf5e8"></stop><stop offset=".45" stop-color="#8d8577"></stop><stop offset="1" stop-color="#0a0b0c"></stop></linearGradient>
      <linearGradient id="dg-ring-in" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f2529"></stop><stop offset="1" stop-color="#9aa5ac"></stop></linearGradient>
      <symbol id="dg-star" viewBox="-100 -100 200 200" overflow="visible">
        <path d="M0-98 L-24-24 L0 0Z" fill="#f4ecdc"></path>
        <path d="M0-98 L24-24 L0 0Z" fill="#111417"></path>
        <path d="M98 0 L24-24 L0 0Z" fill="#dcd2bf"></path>
        <path d="M98 0 L24 24 L0 0Z" fill="#0a0c0e"></path>
        <path d="M0 98 L24 24 L0 0Z" fill="#07080a"></path>
        <path d="M0 98 L-24 24 L0 0Z" fill="#b3aa99"></path>
        <path d="M-98 0 L-24 24 L0 0Z" fill="#cdc3b0"></path>
        <path d="M-98 0 L-24-24 L0 0Z" fill="#fbf5e8"></path>
        <path d="M0-98 L-24-24 M-98 0 L-24-24" stroke="#ffffff" stroke-width="2.5" opacity=".9" fill="none"></path>
        <path d="M0-98 L24-24 L98 0 L24 24 L0 98 L-24 24 L-98 0 L-24-24Z" fill="none" stroke="#000" stroke-width="7" stroke-linejoin="miter"></path>
        <path d="M3-88 L21-28 M88 3 L28 21 M3 88 L21 28" stroke="#6fc7e8" stroke-width="4" stroke-linecap="round" fill="none"></path>
        <path d="M-40 -8 L-70 -3 M8 -44 L4 -70" stroke="#ffffff" stroke-width="1.4" opacity=".45"></path>
        <circle r="31" fill="url(#dg-ring)" stroke="#07090b" stroke-width="4"></circle>
        <circle r="21" fill="url(#dg-ring-in)"></circle>
        <circle r="12" fill="#050607"></circle>
        <path d="M4 11 A 12 12 0 0 0 11 4" stroke="#c9d2d8" stroke-width="2" fill="none"></path>
      </symbol>
      <symbol id="dg-star-sil" viewBox="-100 -100 200 200" overflow="visible">
        <path d="M0-98 L24-24 L98 0 L24 24 L0 98 L-24 24 L-98 0 L-24-24Z"></path>
      </symbol>
    </defs>
  </svg>

  <!-- THE WALL: two buildings of baked brick; a gap between them runs to a red arch at the vanishing point -->
  <div style="position: absolute; left: 0; top: 0; width: 1270px; height: 872px; background: url('{{ tex }}brick.png') 0 0 / 512px 256px repeat"></div>
  <div style="position: absolute; left: 1470px; top: 0; width: 450px; height: 872px; background: url('{{ tex }}brick.png') -200px -64px / 512px 256px repeat"></div>
  <sc-if value="{{ isHit }}" hint-placeholder-val="{{ false }}">
    <!-- the freeze: the same wall, baked grey, cross-faded in by opacity -->
    <div data-fx="drain" style="position: absolute; left: 0; top: 0; width: 1270px; height: 872px; background: url('{{ tex }}brick-bw.png') 0 0 / 512px 256px repeat"></div>
    <div data-fx="drain" style="position: absolute; left: 1470px; top: 0; width: 450px; height: 872px; background: url('{{ tex }}brick-bw.png') -200px -64px / 512px 256px repeat"></div>
  </sc-if>
  <div style="position: absolute; left: 1470px; top: 0; width: 450px; height: 872px; background: linear-gradient(90deg, rgba(4,5,8,.55), rgba(4,5,8,.25) 30%, rgba(4,5,8,.4))"></div>

  <svg viewBox="0 0 1920 1080" style="position: absolute; left: 0; top: 0; width: 1920px; height: 1080px" aria-hidden="true">
    <defs>
      <linearGradient id="dg-streak" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".8"></stop><stop offset="1" stop-color="#000" stop-opacity="0"></stop></linearGradient>
      <linearGradient id="dg-rust" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a2a12" stop-opacity=".7"></stop><stop offset="1" stop-color="#5a2a12" stop-opacity="0"></stop></linearGradient>
      <linearGradient id="dg-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#07090b"></stop><stop offset="1" stop-color="{{ p.sky }}"></stop></linearGradient>
      <linearGradient id="dg-inL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#020203"></stop><stop offset=".6" stop-color="#060506"></stop><stop offset="1" stop-color="{{ p.inLit }}"></stop></linearGradient>
      <linearGradient id="dg-inR" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#020203"></stop><stop offset=".6" stop-color="#070506"></stop><stop offset="1" stop-color="{{ p.inLit }}"></stop></linearGradient>
      <linearGradient id="dg-farfloor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="{{ p.floorLit }}"></stop><stop offset="1" stop-color="#060505"></stop></linearGradient>
      <linearGradient id="dg-redstreak" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="{{ p.neonA }}" stop-opacity=".9"></stop><stop offset="1" stop-color="{{ p.neonB }}" stop-opacity=".1"></stop></linearGradient>
      <radialGradient id="dg-neonglow"><stop offset="0" stop-color="{{ p.neonA }}" stop-opacity=".75"></stop><stop offset=".4" stop-color="{{ p.neonB }}" stop-opacity=".3"></stop><stop offset="1" stop-color="{{ p.neonB }}" stop-opacity="0"></stop></radialGradient>
      <radialGradient id="dg-arch" cx="1370" cy="690" r="130" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="{{ p.archCore }}"></stop><stop offset=".45" stop-color="{{ p.archMid }}"></stop><stop offset="1" stop-color="{{ p.archEdge }}"></stop></radialGradient>
      <linearGradient id="dg-fog1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="{{ p.fog1 }}" stop-opacity="0"></stop><stop offset=".35" stop-color="{{ p.fog1 }}" stop-opacity=".22"></stop><stop offset="1" stop-color="{{ p.fog1 }}" stop-opacity=".16"></stop></linearGradient>
      <linearGradient id="dg-fog2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="{{ p.fog2 }}" stop-opacity="0"></stop><stop offset=".35" stop-color="{{ p.fog2 }}" stop-opacity=".26"></stop><stop offset="1" stop-color="{{ p.fog2 }}" stop-opacity=".18"></stop></linearGradient>
      <linearGradient id="dg-fog3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="{{ p.fog3 }}" stop-opacity="0"></stop><stop offset=".35" stop-color="{{ p.fog3 }}" stop-opacity=".14"></stop><stop offset="1" stop-color="{{ p.fog3 }}" stop-opacity=".1"></stop></linearGradient>
      <linearGradient id="dg-rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="{{ p.neonB }}" stop-opacity="0"></stop><stop offset=".6" stop-color="{{ p.neonA }}" stop-opacity=".85"></stop><stop offset="1" stop-color="{{ p.neonB }}" stop-opacity=".25"></stop></linearGradient>
      <clipPath id="dg-slot"><rect x="1270" y="0" width="200" height="872"></rect></clipPath>
      <radialGradient id="dg-fall" cx="1170" cy="160" r="1250" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#000" stop-opacity="0"></stop><stop offset=".3" stop-color="#000" stop-opacity=".18"></stop><stop offset=".62" stop-color="#000" stop-opacity=".62"></stop><stop offset="1" stop-color="#000" stop-opacity=".86"></stop>
      </radialGradient>
      <radialGradient id="dg-sheen" cx="1170" cy="150" r="720" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="{{ p.sheenA }}" stop-opacity=".34"></stop><stop offset=".35" stop-color="{{ p.sheenB }}" stop-opacity=".1"></stop><stop offset="1" stop-color="{{ p.sheenB }}" stop-opacity="0"></stop>
      </radialGradient>
      <radialGradient id="dg-redspill" cx="1370" cy="640" r="380" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="{{ p.neonB }}" stop-opacity="{{ p.spill }}"></stop><stop offset="1" stop-color="{{ p.neonB }}" stop-opacity="0"></stop>
      </radialGradient>
      <linearGradient id="dg-base" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"></stop><stop offset="1" stop-color="#000" stop-opacity=".6"></stop></linearGradient>
      <linearGradient id="dg-floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#110d0c"></stop><stop offset="1" stop-color="#030303"></stop></linearGradient>
    </defs>

    <!-- grime: long drips from the roofline and rust under the lamp bracket -->
    <sc-for list="{{ streaks }}" as="s" hint-placeholder-count="12">
      <rect x="{{ s.x }}" y="{{ s.y }}" width="{{ s.w }}" height="{{ s.h }}" fill="url(#dg-streak)" opacity="{{ s.o }}"></rect>
    </sc-for>
    <path d="M1236 58 q -3 60 2 130 q 3 60 -1 120" stroke="url(#dg-rust)" stroke-width="10" fill="none" opacity="{{ p.rust }}"></path>

    <!-- the far alley: near-black side walls converge on a bright red arch; fog planes step lighter towards it -->
    <g clip-path="url(#dg-slot)">
      <rect x="1270" y="0" width="200" height="872" fill="url(#dg-sky)"></rect>
      <rect x="1308" y="220" width="124" height="541" fill="#070506"></rect>
      <circle cx="1370" cy="660" r="190" fill="url(#dg-neonglow)"></circle>
      <path d="M1308 761 V598 A62 62 0 0 1 1432 598 V761Z" fill="url(#dg-arch)"></path>
      <path d="M1352 761 V640 A18 18 0 0 1 1388 640 V761Z" fill="{{ p.archCore }}" opacity=".7"></path>
      <polygon points="1270,0 1308,220 1308,761 1270,872" fill="url(#dg-inL)"></polygon>
      <polygon points="1470,0 1432,220 1432,761 1470,872" fill="url(#dg-inR)"></polygon>
      <sc-for list="{{ farLines }}" as="l"><path d="{{ l }}" stroke="{{ p.neonB }}" stroke-width="3" opacity=".55" fill="none"></path></sc-for>
      <path d="M1270 0 L1308 220 H1432 L1470 0 M1308 220 V761 M1432 220 V761" stroke="{{ p.neonB }}" stroke-width="2" opacity=".5" fill="none"></path>
      <polygon points="1308,761 1432,761 1470,872 1270,872" fill="url(#dg-farfloor)"></polygon>
      <polygon points="1350,761 1390,761 1412,872 1328,872" fill="url(#dg-redstreak)"></polygon>
      <rect x="1296" y="520" width="148" height="260" fill="url(#dg-fog1)"></rect>
      <rect x="1284" y="440" width="172" height="380" fill="url(#dg-fog2)"></rect>
      <rect x="1270" y="340" width="200" height="532" fill="url(#dg-fog3)"></rect>
    </g>
    <rect x="1266" y="300" width="5" height="572" fill="url(#dg-rim)"></rect>
    <rect x="1469" y="300" width="5" height="572" fill="url(#dg-rim)"></rect>

    <!-- light: bricks fall off into dark away from the lamp; lamp sheen and red spill as plain translucent colour -->
    <rect width="1920" height="872" fill="url(#dg-fall)"></rect>
    <rect width="1920" height="872" fill="url(#dg-sheen)"></rect>
    <rect width="1920" height="872" fill="url(#dg-redspill)"></rect>
    <rect y="700" width="1920" height="172" fill="url(#dg-base)"></rect>
    <path d="M 560 0 L 590 150 L 548 238 L 612 410 M 590 150 L 668 188" stroke="#080504" stroke-width="3" fill="none" opacity=".85"></path>
    <rect y="864" width="1920" height="10" fill="#0a0707"></rect>
    <rect y="872" width="1920" height="208" fill="url(#dg-floor)"></rect>
  </svg>
  <sc-if value="{{ isHit }}" hint-placeholder-val="{{ false }}">
    <div data-fx="drain" style="position: absolute; inset: 0; background: radial-gradient(ellipse 60% 60% at 48% 46%, rgba(0,0,0,0), rgba(0,0,0,.4))"></div>
  </sc-if>

  <!-- spray-painted directions, part of the wall -->
  <sc-for list="{{ sprays }}" as="w" hint-placeholder-count="3">
    <div style="position: absolute; left: {{ w.x }}px; top: {{ w.y }}px; transform: rotate({{ w.r }}deg); font-family: 'Permanent Marker', cursive; font-size: 80px; line-height: 1; color: #efe6d2; opacity: {{ w.o }}; text-shadow: 0 0 3px rgba(239,230,210,.55), 0 0 14px rgba(239,230,210,.25); white-space: nowrap">{{ w.text }}</div>
  </sc-for>
  <sc-for list="{{ drips }}" as="d" hint-placeholder-count="10">
    <div style="position: absolute; left: {{ d.x }}px; top: {{ d.y }}px; width: 4px; height: {{ d.h }}px; border-radius: 0 0 3px 3px; background: linear-gradient(180deg, {{ d.c }}, transparent); opacity: {{ d.o }}"></div>
  </sc-for>

  <!-- dodged: MISSED sprayed on the right building in cold cyan -->
  <sc-if value="{{ isDodged }}" hint-placeholder-val="{{ false }}">
    <div data-fx="missed" style="position: absolute; left: 1494px; top: 110px; transform: rotate(-7deg); font-family: 'Permanent Marker', cursive; font-size: 92px; line-height: 1; color: #8fdcf5; text-shadow: 0 0 4px rgba(111,199,232,.9), 0 0 22px rgba(111,199,232,.55), 0 0 60px rgba(111,199,232,.25); white-space: nowrap">MISSED</div>
  </sc-if>

  <!-- the lamp and its cone, aimed at the target (normal blend, pre-lightened colour) -->
  <div data-fx="lamp" style="position: absolute; inset: 0; pointer-events: none">
    <div style="position: absolute; inset: 0; clip-path: polygon(1146px 124px, 1194px 124px, 1500px 872px, 690px 872px); background: linear-gradient(180deg, transparent 100px, {{ p.cone1 }} 130px, {{ p.cone2 }} 640px, transparent 872px)"></div>
    <div style="position: absolute; left: 820px; top: 830px; width: 620px; height: 120px; border-radius: 50%; background: radial-gradient(ellipse closest-side, {{ p.pool }}, transparent)"></div>
    <div style="position: absolute; left: 1040px; top: -10px; width: 260px; height: 260px; border-radius: 50%; background: radial-gradient(circle closest-side, {{ p.bulb1 }}, {{ p.bulb2 }} 45%, transparent)"></div>
  </div>
  <svg viewBox="0 0 200 160" style="position: absolute; left: 1070px; top: 0; width: 200px; height: 160px; overflow: visible" aria-hidden="true">
    <rect x="160" y="30" width="22" height="46" fill="#15181b" stroke="#000" stroke-width="2"></rect>
    <path d="M 170 52 C 150 52, 110 44, 100 88" stroke="#1a1d20" stroke-width="9" fill="none" stroke-linecap="round"></path>
    <path d="M 58 110 Q 100 76 142 110 L 150 126 L 50 126 Z" fill="#23282c" stroke="#000" stroke-width="3"></path>
    <path d="M 64 106 Q 100 82 128 96" stroke="#5a646a" stroke-width="3" fill="none"></path>
    <ellipse cx="100" cy="127" rx="34" ry="9" fill="#fff0d6"></ellipse>
  </svg>

  <!-- hit: the red speed ribbons over the frozen grey scene -->
  <sc-if value="{{ isHit }}" hint-placeholder-val="{{ false }}">
    <svg data-fx="ribbons" viewBox="0 0 1920 1080" style="position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; z-index: 5" aria-hidden="true">
      <sc-for list="{{ ribbons }}" as="b"><path d="{{ b.d }}" fill="{{ b.c }}" opacity="{{ b.o }}"></path></sc-for>
    </svg>
  </sc-if>

  <!-- dodged: the cold-rim afterimage where the polaroid was, and the shuriken's line in -->
  <sc-if value="{{ isDodged }}" hint-placeholder-val="{{ false }}">
    <sc-for list="{{ afterimages }}" as="a">
      <div data-fx="ghost" style="position: absolute; left: {{ a.x }}px; top: 310px; width: 300px; height: 362px; transform: rotate(-2deg); transform-origin: 50% 12%; background: linear-gradient(90deg, rgba(190,236,250,{{ a.o2 }}), rgba(111,199,232,{{ a.o }}) 10%, rgba(111,199,232,0) 55%); box-shadow: -5px 0 0 rgba(160,226,248,{{ a.o2 }}), -6px 0 22px rgba(111,199,232,{{ a.o }})"></div>
    </sc-for>
    <sc-for list="{{ coldStreaks }}" as="s">
      <div style="position: absolute; left: {{ s.x }}px; top: {{ s.y }}px; width: {{ s.w }}px; height: {{ s.h }}px; border-radius: 3px; background: linear-gradient(90deg, rgba(111,199,232,0), rgba(160,226,248,{{ s.o }}))"></div>
    </sc-for>
    <sc-for list="{{ trail }}" as="s">
      <div style="position: absolute; left: {{ s.x }}px; top: {{ s.y }}px; width: {{ s.w }}px; height: {{ s.h }}px; border-radius: 3px; background: linear-gradient(90deg, rgba(241,232,212,0), rgba(241,232,212,{{ s.o }}))"></div>
    </sc-for>
  </sc-if>

  <!-- the target -->
  <sc-if value="{{ isHit }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; z-index: 5; left: 1046px; top: 296px; width: 58px; height: 28px; background: rgba(222,212,182,.8); transform: rotate(21deg); clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 12% 70%, 0 45%, 14% 22%); box-shadow: 0 2px 4px rgba(0,0,0,.35)"></div>
  </sc-if>
  <div data-fx="photo" style="position: absolute; z-index: 5; left: {{ photoLeft }}px; top: 310px; width: 300px; height: 362px; transform: {{ photoTransform }}; transform-origin: {{ photoOrigin }}">
    <div style="position: absolute; inset: 0; box-shadow: -30px 40px 46px rgba(0,0,0,.85); clip-path: {{ photoClipShadow }}"></div>
    <div style="position: absolute; inset: 0; box-sizing: border-box; padding: 14px 14px 64px; background: #f4efe4; clip-path: {{ photoClip }}">
      <div style="width: 100%; height: 100%; background: radial-gradient(circle at 50% 38%, #b9c3bf 0 17%, transparent 18%), radial-gradient(ellipse 46% 40% at 50% 98%, #8fa09d 0 62%, transparent 63%), linear-gradient(160deg, #2c6e74, #0f3a41 55%, #06191d)"></div>
      <div style="position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; font-family: 'Big Shoulders Display', sans-serif; font-weight: 900; font-style: italic; font-size: 48px; color: #1b1712">TOM</div>
      <div style="position: absolute; inset: 0; background: linear-gradient(225deg, rgba(255,196,120,.34), transparent 45%, rgba(0,0,0,.3))"></div>
      <div style="position: absolute; inset: 0; background: url('{{ tex }}grain.png') 0 0 / 256px 256px; opacity: .12"></div>
      <sc-if value="{{ isHit }}" hint-placeholder-val="{{ false }}">
        <svg viewBox="0 0 300 362" style="position: absolute; inset: 0; width: 300px; height: 362px" aria-hidden="true">
          <g fill="none" stroke-linecap="round" stroke-linejoin="round">
            <sc-for list="{{ photoCracks }}" as="c"><path d="{{ c.d }}" stroke="#050505" stroke-width="{{ c.w }}" opacity=".85"></path></sc-for>
            <sc-for list="{{ photoCracks }}" as="c"><path d="{{ c.d }}" stroke="#fffaf0" stroke-width="1.4" transform="translate(-1.5 -1.5)" opacity=".7"></path></sc-for>
          </g>
          <circle cx="190" cy="140" r="58" fill="#0a0605" opacity=".35"></circle>
        </svg>
      </sc-if>
    </div>
    <!-- two-colour rim: cold on the left, far-neon red on the right -->
    <div style="position: absolute; left: -4px; top: 6px; bottom: 10px; width: 5px; background: linear-gradient(180deg, rgba({{ p.cold }},.25), rgba({{ p.cold }},.95) 40%, rgba({{ p.cold }},.4)); box-shadow: -2px 0 14px rgba({{ p.cold }},.55)"></div>
    <div style="position: absolute; right: -4px; top: 10px; bottom: {{ rimRBottom }}px; width: 5px; background: linear-gradient(180deg, rgba({{ p.hot }},.3), rgba({{ p.hot }},.95) 55%, rgba({{ p.hot }},.5)); box-shadow: 2px 0 16px rgba({{ p.hot }},.6)"></div>
    <div style="position: absolute; left: -18px; top: -10px; width: 96px; height: 30px; background: rgba(222,212,182,.8); transform: rotate(-24deg); box-shadow: 0 2px 4px rgba(0,0,0,.35)"></div>
    <sc-if value="{{ !isHit }}" hint-placeholder-val="{{ true }}">
      <div style="position: absolute; right: -16px; top: -8px; width: 92px; height: 30px; background: rgba(222,212,182,.74); transform: rotate(21deg); box-shadow: 0 2px 4px rgba(0,0,0,.35)"></div>
    </sc-if>
    <sc-if value="{{ isHit }}" hint-placeholder-val="{{ false }}">
      <svg viewBox="0 0 300 362" style="position: absolute; left: 0; top: 0; width: 300px; height: 362px; overflow: visible" aria-hidden="true">
        <path d="M 318 300 q 20 40 4 86 M 300 348 q 12 26 -2 52" stroke="#f1e8d4" stroke-width="5" fill="none" stroke-linecap="round" opacity=".55"></path>
      </svg>
      <svg data-fx="star" viewBox="-100 -100 200 200" style="position: absolute; left: 15px; top: -35px; width: 350px; height: 350px; overflow: visible; transform: rotate(24deg)" aria-hidden="true">
        <use href="#dg-star-sil" x="-100" y="-100" width="200" height="200" transform="translate(-14 16)" fill="#000" opacity=".55"></use>
        <use href="#dg-star" x="-100" y="-100" width="200" height="200"></use>
      </svg>
    </sc-if>
  </div>

  <!-- hit: shards burst away from the impact -->
  <sc-if value="{{ isHit }}" hint-placeholder-val="{{ false }}">
    <sc-for list="{{ shards }}" as="s">

      { d: `M-40 330 L${IX - 80} ${IY - 18} L${IX - 80} ${IY - 12} L-40 358Z`, c: '#fbe0d2', o: .8, flash: 1, fc: '#f1e8d4' },
      { d: `M-40 640 L${IX - 70} ${IY + 20} L${IX - 70} ${IY + 26} L-40 668Z`, c: '#fbe0d2', o: .7, flash: 1, fc: '#f1e8d4' },
      { d: `M-40 230 L${IX - 140} ${IY - 60} L${IX - 140} ${IY - 55} L-40 252Z`, c: '#e8674a', o: .8, flash: 1, fc: '#f1e8d4' },
      { d: `M-40 760 L${IX - 150} ${IY + 60} L${IX - 150} ${IY + 66} L-40 786Z`, c: '#e8674a', o: .8, flash: 1, fc: '#f1e8d4' },
    ] : [];
    // cracks across the polaroid, in card coordinates, from the impact
    const photoCracks = [];
    for (let k = 0; k < 9; k++) {
      let a = k / 9 * Math.PI * 2 + rnd(k + 800) * .5, x = 190, y = 140, d = 'M ' + x + ' ' + y;
      const len = 90 + rnd(k + 820) * 190;
      for (let s = 0; s < 5; s++) { a += (rnd(k * 7 + s + 840) - .5) * .7; x += Math.cos(a) * len / 5; y += Math.sin(a) * len / 5; d += ' L ' + f1(x) + ' ' + f1(y); }
      photoCracks.push({ d, w: (4 - k % 3).toFixed(1) });
    }
    // shards burst forward and down, away from the throw side
    const shardShapes = ['-14,-30 24,-18 18,20 -22,12', '-10,-34 26,-4 4,30 -24,6', '-20,-16 22,-26 12,24', '-6,-22 30,0 10,24 -20,14'];
    const shards = hit ? Array.from({ length: 11 }, (_, i) => {
      const a = (-50 + (i / 10) * 110 + rnd(i + 900) * 12) * Math.PI / 180, d = 200 + rnd(i + 920) * 200;
      const dx = Math.round(Math.cos(a) * d), dy = Math.round(Math.sin(a) * d * .85);
      return { x: IX + dx, y: IY + dy, dx, dy, r: Math.round(rnd(i + 940) * 360), k: (.7 + rnd(i + 960) * .9).toFixed(2), p: shardShapes[i % 4], c: ['#e9e1cf', '#1f5a61', '#d9cfb9', '#2c6e74'][i % 4] };
    }) : [];
    // dodged
    const chips = Array.from({ length: 14 }, (_, i) => { const a = i / 14 * Math.PI * 2; const d = 50 + rnd(i + 400) * 80; return { x: Math.round(Math.cos(a) * d), y: Math.round(Math.sin(a) * d * .8), s: 7 + Math.round(rnd(i + 420) * 9), r: Math.round(rnd(i + 440) * 90) }; });
    const sparks = Array.from({ length: 14 }, (_, i) => { const a = (i / 14 + rnd(i + 500) * .05) * Math.PI * 2, r0 = 40 + rnd(i + 510) * 20, r1 = r0 + 50 + rnd(i + 520) * 90; return { d: `M${f1(Math.cos(a) * r0)} ${f1(Math.sin(a) * r0)} L${f1(Math.cos(a) * r1)} ${f1(Math.sin(a) * r1)}`, c: i % 3 ? '#ffd27a' : '#fff6dc', w: i % 3 ? 3 : 5 }; });
    const afterimages = [{ x: 780, o: .18, o2: .45 }, { x: 850, o: .28, o2: .7 }, { x: 915, o: .4, o2: .95 }];
    const coldStreaks = Array.from({ length: 9 }, (_, i) => ({ x: 760 + Math.round(rnd(i + 600) * 60), y: 330 + Math.round(i * 38 + rnd(i + 610) * 14), w: 170 + Math.round(rnd(i + 620) * 90), h: i % 3 ? 4 : 7, o: (.45 + rnd(i + 630) * .4).toFixed(2) }));
    const trail = [{ x: 60, y: 430, w: 560, h: 7, o: .6 }, { x: 150, y: 410, w: 450, h: 4, o: .45 }, { x: 200, y: 454, w: 400, h: 4, o: .4 }];
    // puddle detail
    const slivers = Array.from({ length: 22 }, (_, i) => ({ x: Math.round(100 + rnd(i + 700) * 1760), y: Math.round(890 + rnd(i + 710) * 170), w: 60 + Math.round(rnd(i + 720) * 260), h: 2 + Math.round(rnd(i + 730) * 3), o: (.35 + rnd(i + 740) * .4).toFixed(2) }));
    const ripples = [[760, 960], [980, 1020], [1260, 940], [1450, 960]].map(([x, y], i) => ({ x, y, rx: 40 + i % 3 * 18, ry: 9 + i % 3 * 4, o: (.18 + (i % 4) * .06).toFixed(2) }));
    // palettes: the hit is drawn in greys (red kept for the ribbons and the stamp only)
    const COLOUR = { sky: '#1a1d22', inLit: '#5a1826', floorLit: '#3a121a', neonA: '#ff5a70', neonB: '#e0304a', archCore: '#ffe4e8', archMid: '#ff2444', archEdge: '#a8081f',
      fog1: '#ff8090', fog2: '#9a6a74', fog3: '#5d646a', sheenA: '#ffcf8a', sheenB: '#ff8a1e', spill: .26, rust: 1, wallRef: '#2d1812',
      cone1: 'rgba(255,214,150,.26)', cone2: 'rgba(255,150,60,.06)', pool: 'rgba(255,184,102,.3)', bulb1: 'rgba(255,226,184,.6)', bulb2: 'rgba(255,138,30,.2)',
      cold: '111,199,232', hot: '224,48,74', sodium: '#ffa24a' };
    const GREY = { sky: '#202020', inLit: '#2c2c2c', floorLit: '#2a2a2a', neonA: '#f2f2f2', neonB: '#b0b0b0', archCore: '#ffffff', archMid: '#e4e4e4', archEdge: '#9a9a9a',
      fog1: '#e6e6e6', fog2: '#a8a8a8', fog3: '#7a7a7a', sheenA: '#ffffff', sheenB: '#d0d0d0', spill: 0, rust: 0, wallRef: '#262626',
      cone1: 'rgba(255,255,255,.2)', cone2: 'rgba(230,230,230,.05)', pool: 'rgba(255,255,255,.26)', bulb1: 'rgba(255,255,255,.55)', bulb2: 'rgba(210,210,210,.15)',
      cold: '214,218,222', hot: '214,214,214', sodium: '#d8d8d8' };
    const photoLeft = dodged ? 960 : 780;
    const angle = hit && !flash ? 18 : dodged ? 5 : -2;
    return {
      tex: '/public/textures/',
      rippleOn: live && !(this.props.motion === false || matchMedia('(prefers-reduced-motion: reduce)').matches) ? 1 : 0,
      p: hit ? GREY : COLOUR,
      streaks, sprays, drips, farLines, ribbons, photoCracks, shards, chips, sparks, afterimages, coldStreaks, trail, slivers, ripples,
      isLive: live, isHit: hit, isDodged: dodged, showFlash: hit, flashOpacity: flash ? 1 : 0,
      photoLeft,
      photoTransform: 'rotate(' + angle + 'deg)',
      photoOrigin: hit ? '10% 2%' : '50% 12%',
      photoClip: hit ? 'polygon(0 0, 100% 0, 100% 84%, 90% 90%, 84% 100%, 0 100%)' : 'none',
      photoClipShadow: hit ? 'polygon(-40% -20%, 100% -20%, 100% 84%, 84% 100%, -40% 140%)' : 'none',
      rimRBottom: hit ? 70 : 10,
      // the reflection: the polaroid flipped under the waterline, squashed, darker
      refTransform: `translate(${photoLeft} ${hit ? 1010 : 1000}) scale(1 -.36) rotate(${-angle} 150 0)`,
      rainOpacity: hit ? .55 : 1,
      titleZ: hit ? 6 : 'auto',
      neonColor: hit ? '#f1e8d4' : '#ffe2b8', neonStroke: hit ? '#fffaf0' : '#fff3dc',
      neonShadow: hit ? '0 4px 0 #000, 0 0 24px #000' : '0 0 2px #fff, 0 0 10px #ff8a1e, 0 0 34px #ff8a1e, 0 0 80px rgba(255,138,30,.55)',
      kicker: "SOMETHING'S COMING FOR TOM",
      title: 'DODGE!',
      tagline: live ? 'Read where it comes from, or take the hit.' : '',
      caption: live ? 'Swipe on your phone: left, high or right' : hit ? 'It came from the left. Tom went right. Hit.' : 'It came from the left. Tom read it. Missed.',
    };
  }
}
