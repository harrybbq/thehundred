<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Biggest Champ</title>
<script src="./support.js"></script>
<script src="./machine-kit.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&amp;family=Big+Shoulders+Stencil+Display:wght@900&amp;family=Courier+Prime:wght@400;700&amp;family=IM+Fell+English:ital@0;1&amp;family=IM+Fell+English+SC&amp;family=Permanent+Marker&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="./machine-kit.css">
<style>
  body{margin:0;background:#020202}
  /* ---- panels (the Penny Drop console language, in brass) */
  .ch-panel{position:absolute;box-sizing:border-box;
    background:
      radial-gradient(circle at 16px 16px,#b9c1c4 0 3px,#3a4448 5px,transparent 6.5px),
      radial-gradient(circle at calc(100% - 16px) 16px,#b9c1c4 0 3px,#3a4448 5px,transparent 6.5px),
      radial-gradient(circle at 16px calc(100% - 16px),#b9c1c4 0 3px,#3a4448 5px,transparent 6.5px),
      radial-gradient(circle at calc(100% - 16px) calc(100% - 16px),#b9c1c4 0 3px,#3a4448 5px,transparent 6.5px),
      linear-gradient(180deg,#2c3840,#1a2226 55%,#12171a);
    box-shadow:0 0 0 2px #000,inset 0 2px 0 rgba(241,232,212,.16),inset 0 -4px 0 rgba(0,0,0,.5),0 30px 50px rgba(0,0,0,.85)}
  .ch-panel>.ch-dither{position:absolute;inset:0;background:url('/public/textures/dither.png') 0 0/128px 128px;image-rendering:pixelated;opacity:.12;pointer-events:none}
  .ch-strip{position:absolute;left:28px;right:28px;top:24px;height:56px;display:grid;place-items:center;border-radius:3px;
    font-family:'IM Fell English SC',serif;font-size:36px;letter-spacing:.1em;line-height:1;color:#2a1e00;
    background:linear-gradient(180deg,#fff0b0,#e0b458 45%,#a57a22 85%,#6a4e0a);box-shadow:0 0 0 2px #000,inset 0 -3px 0 rgba(58,44,0,.5),0 4px 6px rgba(0,0,0,.6)}
  .ch-kick{font-family:'Courier Prime',monospace;font-weight:700;font-size:32px;letter-spacing:.2em;line-height:1;color:#e8d9a8;text-align:center;white-space:nowrap;text-shadow:0 2px 0 #000}
  .ch-ink{font-family:'Permanent Marker',cursive;color:#ffd84a;text-align:center;line-height:1;text-shadow:0 0 18px rgba(255,216,74,.45),0 3px 0 #000}
  .ch-quote{font-family:'IM Fell English',serif;font-style:italic;font-size:40px;line-height:1.1;color:#f1e8d4;text-align:center}
  .ch-quote b{font-weight:400;color:#ffd84a}
  .ch-drip{position:absolute;width:7px;background:#ffd84a;border-radius:0 0 5px 5px;box-shadow:0 0 8px rgba(255,216,74,.4)}
  .ch-sub{font-family:'Big Shoulders Display',Impact,sans-serif;font-weight:900;font-size:60px;line-height:1;letter-spacing:.03em;color:#ffd84a;text-align:center;white-space:nowrap;text-shadow:0 2px 0 #000,0 0 22px rgba(255,216,74,.35)}
  .ch-sub b{color:#fff3c0}

  /* ---- the gilt commendation frame */
  .ch-frame{position:absolute;box-sizing:border-box;border-radius:6px;
    background:
      radial-gradient(circle at 18px 18px,#fff6d0 0 5px,#8a6a10 7px,transparent 8.5px),
      radial-gradient(circle at calc(100% - 18px) 18px,#fff6d0 0 5px,#8a6a10 7px,transparent 8.5px),
      radial-gradient(circle at 18px calc(100% - 18px),#fff6d0 0 5px,#8a6a10 7px,transparent 8.5px),
      radial-gradient(circle at calc(100% - 18px) calc(100% - 18px),#fff6d0 0 5px,#8a6a10 7px,transparent 8.5px),
      linear-gradient(135deg,#fff0b0 0%,#e0b458 18%,#8a6a10 38%,#f5d77a 56%,#a57a22 74%,#5a4000 100%);
    box-shadow:0 0 0 3px #1a1200,inset 0 0 0 3px #fff3c0,inset 0 0 0 8px #b88a22,inset 0 0 0 11px #3a2a00,0 0 60px 10px rgba(255,200,80,.18),0 30px 40px rgba(0,0,0,.85)}
  .ch-mat{position:absolute;inset:30px;border-radius:2px;background:#140e05;box-shadow:inset 0 0 0 2px #000,inset 0 6px 14px rgba(0,0,0,.9)}
  .ch-photo{position:absolute;inset:12px;overflow:hidden;background:#333}
  .ch-photo>svg{display:block;width:100%;height:100%}
  .ch-photo::after{content:'';position:absolute;inset:0;background:linear-gradient(200deg,rgba(255,226,150,.28),transparent 40%,rgba(0,0,0,.3))}
  .ch-plate{position:absolute;box-sizing:border-box;border-radius:5px;text-align:center;
    background:linear-gradient(180deg,#fff0b0,#e0b458 40%,#a57a22 82%,#6a4e0a);
    box-shadow:0 0 0 3px #1a1200,inset 0 2px 0 #fff8d8,inset 0 -4px 0 rgba(58,44,0,.45),0 10px 16px rgba(0,0,0,.8)}
  .ch-plate-for{font-family:'IM Fell English SC',serif;font-size:24px;letter-spacing:.08em;line-height:1;color:#4a3600;padding-top:10px}
  .ch-plate-name{font-family:'Big Shoulders Display',Impact,sans-serif;font-weight:900;line-height:1;color:#2a1e00;letter-spacing:.02em;margin-top:2px;text-shadow:0 1px 0 rgba(255,248,216,.7)}
  .ch-glint{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;pointer-events:none;
    background:radial-gradient(circle,#fffbe8 0 3px,rgba(255,240,180,.7) 5px,transparent 12px),
      linear-gradient(90deg,transparent 45%,rgba(255,248,220,.9) 50%,transparent 55%),linear-gradient(0deg,transparent 45%,rgba(255,248,220,.9) 50%,transparent 55%)}

  /* ---- the ticket printer and the golden ticket */
  .ch-printer{position:absolute;box-sizing:border-box;border-radius:6px;
    background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px),linear-gradient(180deg,#4a5257,#2c3337 40%,#161b1e);
    box-shadow:0 0 0 2px #000,inset 0 2px 0 rgba(241,232,212,.25),inset 0 -4px 0 rgba(0,0,0,.5),0 12px 18px rgba(0,0,0,.8)}
  .ch-slot{position:absolute;left:34px;right:34px;bottom:8px;height:12px;border-radius:6px;background:#050505;box-shadow:inset 0 3px 4px #000,0 1px 0 rgba(241,232,212,.2)}
  .ch-plamp{position:absolute;top:9px;width:20px;height:20px;border-radius:50%;box-shadow:0 0 0 3px #0a0c0d,0 0 0 4px #4a5358}
  .ch-feed{position:absolute;overflow:hidden}
  .ch-ticket{position:absolute;left:0;right:0;top:0;bottom:0;box-sizing:border-box;text-align:center;color:#3a2800;
    background:radial-gradient(ellipse 60% 80% at 30% 20%,rgba(255,252,230,.55),transparent 60%),linear-gradient(170deg,#fff0b0,#f0c95a 40%,#d9a53a 70%,#b8841e);
    -webkit-mask:radial-gradient(circle at 0 50%,transparent 14px,#000 15px) left/51% 100% no-repeat,radial-gradient(circle at 100% 50%,transparent 14px,#000 15px) right/51% 100% no-repeat;
            mask:radial-gradient(circle at 0 50%,transparent 14px,#000 15px) left/51% 100% no-repeat,radial-gradient(circle at 100% 50%,transparent 14px,#000 15px) right/51% 100% no-repeat}
  .ch-ticket::before{content:'';position:absolute;inset:10px 24px;border:2px dashed rgba(90,64,0,.55);border-radius:4px}
  .ch-tk-small{font-family:'Big Shoulders Display',Impact,sans-serif;font-weight:800;font-size:32px;letter-spacing:.04em;line-height:1;color:#5a4000;white-space:nowrap}
  .ch-tk-big{font-family:'Big Shoulders Display',Impact,sans-serif;font-weight:900;line-height:1;letter-spacing:.03em;color:#2a1e00;white-space:nowrap}

  /* ---- confetti and gold dust */
  .ch-bit{position:absolute;top:0;left:0;border-radius:2px}
  .ch-dust{position:absolute;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:#fff3c0;box-shadow:0 0 8px 2px rgba(255,216,74,.6)}
</style>
</helmet>
<!--
  BIGGEST CHAMP: the gold moment after each party game. Concept: "CHAMP OF THE ROUND", a commendation presentation
  on the Machine set. The beers rack up on a gold seven-segment counter, the champ's portrait drops in on brass chains
  in a gilt frame ("FOR SERVICES TO THE BAR"), a gold rosette is pinned on, and a GOLDEN TICKET prints out of the
  machine under each frame while gold confetti falls. 1-3 champs (ties) share the one count.
  Beats (ms): 0-300 marquee flicks on (2 flashes) · 300-700 kicker + side panels · 600-~1700 counter racks up (eases out)
  (revised) 400-1200 the count · 1000+ frames drop and swing (120ms stagger) · 1400 spotlight on, rays fade up (their
  centre hidden behind the marquee) · 1700 rosettes · 1950-2650 tickets feed out · 2350 plaque marker · 2750-3050 the
  headline (WHO + what happens now). Everything that matters is settled by ~3.1s (TvRoom auto-advances at 6.5s).
  CONTINUE keycap: visible and live from frame 0, never animated. At rest: rays turn slowly, the dust glints.
  motion=false / prefers-reduced-motion: the settled end frame (confetti frozen mid-air).
-->
<div data-fx="root" class="{{ rootClass }}" style="width: 1920px; height: 1080px; position: relative; overflow: hidden; isolation: isolate; background: #0b0804; color: #f1e8d4; font-family: 'Courier Prime', monospace">

  <!-- the room: concrete, warm dark, a gold stage pool -->
  <div class="mk-concrete" style="position: absolute; inset: 0; opacity: .5"></div>
  <div style="position: absolute; inset: 0; background: radial-gradient(ellipse 70% 60% at 50% 55%, rgba(60,40,6,.2), rgba(8,5,1,.82) 70%, #050301)"></div>

  <!-- the sunburst behind the frames (turns slowly at rest) -->
  <div data-fx="raysWrap" style="position: absolute; left: {{ rays.x }}px; top: {{ rays.y }}px; width: 0; height: 0; opacity: 1">
    <svg data-fx="rays" viewBox="-900 -900 1800 1800" width="1800" height="1800" style="position: absolute; left: -900px; top: -900px" aria-hidden="true">
      <defs><radialGradient id="ch-rayg" r=".5"><stop offset=".1" stop-color="#ffd84a" stop-opacity=".34"></stop><stop offset=".6" stop-color="#e0a030" stop-opacity=".08"></stop><stop offset="1" stop-color="#e0a030" stop-opacity="0"></stop></radialGradient></defs>
      <path d="{{ rays.d }}" fill="url(#ch-rayg)"></path>
    </svg>
  </div>

  <!-- the spotlight: a hard cone from the rig onto the frames, and its pool on the floor -->
  <div data-fx="spot" style="position: absolute; inset: 0; pointer-events: none">
    <div style="position: absolute; inset: 0; clip-path: polygon(900px 150px, 1020px 150px, {{ spot.r }}px 1080px, {{ spot.l }}px 1080px); background: linear-gradient(180deg, rgba(255,236,170,.26) 150px, rgba(255,210,100,.1) 640px, rgba(255,200,90,.04) 1000px)"></div>
    <div style="position: absolute; left: {{ spot.l - 80 }}px; width: {{ spot.r - spot.l + 160 }}px; top: 900px; height: 260px; border-radius: 50%; background: radial-gradient(ellipse closest-side, rgba(255,220,120,.22), transparent)"></div>
  </div>
  <div style="position: absolute; inset: 0; pointer-events: none; background: linear-gradient(90deg, rgba(0,0,0,.55), transparent 18%, transparent 82%, rgba(0,0,0,.55))"></div>

  <!-- confetti, back layer: falls behind the frames and panels (motion: one fall; still: frozen mid-air) -->
  <div style="position: absolute; inset: 0; pointer-events: none">
    <sc-for list="{{ bitsB }}" as="b">
      <div data-fx="bit" class="ch-bit" style="width: {{ b.w }}px; height: {{ b.h }}px; background: {{ b.c }}; transform: translate({{ b.x }}px, {{ b.y }}px) rotate({{ b.r }}deg); opacity: {{ b.o }}" data-x="{{ b.x }}" data-d="{{ b.d }}" data-t="{{ b.t }}" data-r="{{ b.r }}" data-s="{{ b.s }}"></div>
    </sc-for>
  </div>

  <!-- THE CHAMPS: gilt frame on brass chains, a name plate, a rosette; under it the ticket printer and the ticket -->
  <sc-for list="{{ cols }}" as="c" hint-placeholder-count="1">
    <div data-fx="col" style="position: absolute; left: {{ c.x }}px; top: {{ c.y }}px; width: {{ c.fw }}px; height: {{ c.hangH }}px">
      <div data-fx="hang" style="position: absolute; left: 0; top: 0; width: {{ c.fw }}px; height: {{ c.hangH }}px; transform-origin: 50% -300px">
        <!-- the picture wire, from a nail just under the kicker -->
        <svg width="{{ c.fw }}" height="60" viewBox="0 0 {{ c.fw }} 60" style="position: absolute; left: 0; top: -50px; overflow: visible" aria-hidden="true">
          <path d="{{ c.wire }}" stroke="#000" stroke-width="7" fill="none" stroke-linejoin="round"></path>
          <path d="{{ c.wire }}" stroke="#c9a227" stroke-width="3" fill="none" stroke-linejoin="round"></path>
          <circle cx="{{ c.fw / 2 }}" cy="8" r="9" fill="#2a3034" stroke="#000" stroke-width="3"></circle><circle cx="{{ c.fw / 2 - 2 }}" cy="6" r="3" fill="#9aa3a7"></circle>
        </svg>
        <div class="ch-frame" style="left: 0; top: 0; width: {{ c.fw }}px; height: {{ c.fw }}px">
          <div class="ch-mat">
            <div class="ch-photo">
              <svg viewBox="0 0 100 100" aria-hidden="true">
                <rect width="100" height="100" fill="{{ c.p.bg }}"></rect>
                <path d="{{ face.body }}" fill="#15120f"></path><path d="{{ face.collar }}" fill="#d8cfbd"></path>
                <path d="{{ face.head }}" fill="{{ c.p.skin }}"></path><path d="{{ face.hair }}" fill="{{ c.p.hair }}"></path>
                <path d="M39 44q4-4 8 0M53 44q4-4 8 0" stroke="#1b1712" stroke-width="2.6" fill="none" stroke-linecap="round"></path>
                <path d="M39 55q11 11 22 0q-11 5-22 0z" fill="#fff" stroke="#1b1712" stroke-width="2" stroke-linejoin="round"></path>
              </svg>
            </div>
          </div>
          <div style="position: absolute; inset: 0; overflow: hidden; border-radius: 6px; pointer-events: none">
            <div data-fx="sheen" style="position: absolute; top: -20%; bottom: -20%; left: 0; width: 34%; opacity: 0; transform: translateX(-120%) skewX(-18deg); background: linear-gradient(90deg, transparent, rgba(255,250,225,.55) 45%, rgba(255,255,255,.75) 50%, rgba(255,250,225,.55) 55%, transparent)"></div>
          </div>
          <div data-fx="glint" class="ch-glint" style="left: {{ c.fw - 40 }}px; top: 40px"></div>
          <div data-fx="glint" class="ch-glint" style="left: 36px; top: {{ c.fw - 34 }}px"></div>
        </div>
        <div class="ch-plate" style="left: {{ c.plX }}px; top: {{ c.fw - 12 }}px; width: {{ c.plW }}px; height: {{ c.plH }}px">
          <div class="ch-plate-name" style="font-size: {{ c.nameFs }}px; line-height: {{ c.plH }}px; margin: 0">{{ c.p.name }}</div>
        </div>
        <!-- the rosette, pinned on the frame's upper-left corner -->
        <div data-fx="rosette" style="position: absolute; left: {{ c.roX }}px; top: {{ c.roY }}px; width: {{ c.ro }}px; height: {{ c.ro * 1.5 }}px; transform: rotate(-12deg)">
          <svg viewBox="-100 -100 200 300" width="{{ c.ro }}" height="{{ c.ro * 1.5 }}" style="overflow: visible" aria-label="Champ rosette">
            <path d="M-46 40 L-78 190 L-46 168 L-26 200 L-6 60Z" fill="#b8841e" stroke="#1a1200" stroke-width="6" stroke-linejoin="round"></path>
            <path d="M46 40 L78 190 L46 168 L26 200 L6 60Z" fill="#8a1a10" stroke="#1a1200" stroke-width="6" stroke-linejoin="round"></path>
            <path d="{{ rosetteD }}" fill="#e0b458" stroke="#1a1200" stroke-width="6" stroke-linejoin="round"></path>
            <circle r="66" fill="#8a1a10" stroke="#1a1200" stroke-width="5"></circle>
            <circle r="54" fill="url(#ch-medal)" stroke="#fff3c0" stroke-width="3"></circle>
            <text y="-14" text-anchor="middle" font-family="'IM Fell English SC', serif" font-size="30" fill="#3a2800">Champ</text>
            <text y="40" text-anchor="middle" font-family="'Big Shoulders Display', Impact, sans-serif" font-weight="900" font-size="60" fill="#2a1e00">No.1</text>
          </svg>
        </div>
      </div>

      <!-- the printer bolted under the plate; the ticket feeds out of its slot -->
      <div class="ch-printer" style="left: {{ c.prX }}px; top: {{ c.prY }}px; width: {{ c.prW }}px; height: 44px">
        <div class="ch-plamp" style="left: 12px; background: radial-gradient(circle at 36% 30%, #8a9297, #33373a 55%, #08090a)"></div>
        <div data-fx="plamp" class="ch-plamp" style="left: 12px; background: radial-gradient(circle at 36% 30%, #fff8d0, #ffd84a 55%, #7a5a00); box-shadow: 0 0 0 3px #0a0c0d, 0 0 0 4px #4a5358, 0 0 16px 4px rgba(255,216,74,.8)"></div>
        <div class="ch-plamp" style="right: 12px; background: radial-gradient(circle at 36% 30%, #8a9297, #33373a 55%, #08090a)"></div>
        <div class="ch-slot"></div>
      </div>
      <div class="ch-feed" style="left: {{ c.tkX }}px; top: {{ c.prY + 38 }}px; width: {{ c.tkW }}px; height: {{ c.tkH + 16 }}px">
        <div data-fx="ticket" class="ch-ticket" style="height: {{ c.tkH }}px; bottom: auto">
          <div class="ch-tk-big" style="font-size: {{ c.tkB }}px; padding-top: 24px">GOLDEN TICKET</div>
          <div class="ch-tk-small" style="margin-top: 8px">SKIP 1 PUNISHMENT</div>
        </div>
      </div>
    </div>
  </sc-for>
  <svg width="0" height="0" style="position: absolute" aria-hidden="true"><defs>
    <radialGradient id="ch-medal" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#fff3c0"></stop><stop offset=".5" stop-color="#e0b458"></stop><stop offset="1" stop-color="#8a6a00"></stop></radialGradient>
  </defs></svg>

  <!-- THE RIG and the GOLD marquee (the chains above run up behind it) -->
  <div data-fx="marquee" style="position: absolute; left: {{ mq.x }}px; top: 18px">
    <div class="mk-marquee mk-marquee--gold" style="--mk-pitch: {{ mq.pitch }}px">
      <div class="mk-marquee-screen" style="width: {{ mq.screenW }}px; height: {{ mq.screenH }}px">
        <svg class="mk-marquee-strip" width="{{ mq.m.width }}" height="{{ mq.m.height }}" viewBox="0 0 {{ mq.m.width }} {{ mq.m.height }}" style="left: {{ mq.left }}px" aria-label="{{ mq.text }}">
          <path class="mk-dot-halo" d="{{ mq.m.d }}"></path>
          <path class="mk-dot" d="{{ mq.m.d }}"></path>
        </svg>
      </div>
    </div>
  </div>
  <div data-fx="kicker" class="ch-kick" style="position: absolute; left: 0; right: 0; top: 184px">{{ kicker }}</div>

  <!-- LEFT: the counter console, the beers rack up -->
  <div data-fx="panelL" class="ch-panel" style="left: {{ con.x }}px; top: {{ con.y }}px; width: {{ con.w }}px; height: {{ con.h }}px">
    <div class="ch-dither"></div>
    <div class="ch-strip">Beers logged</div>
    <div data-fx="segBox" style="position: absolute; left: 0; right: 0; top: 112px; display: flex; justify-content: center">
      <div class="mk-seg mk-seg--gold">
        <svg viewBox="0 -6 {{ seg.vw }} 112" width="{{ seg.w }}" height="{{ seg.h }}" style="overflow: hidden" aria-label="{{ beers }} beers">
          <path class="mk-seg-ghost" d="{{ seg.ghost }}"></path>
          <g data-fx="segStrip" style="transform: translateY({{ seg.stripY }}px)">
            <sc-for list="{{ seg.layers }}" as="L"><g transform="translate(0 {{ L.y }})"><path class="mk-seg-glow" d="{{ L.lit }}"></path><path class="mk-seg-lit" d="{{ L.lit }}"></path></g></sc-for>
          </g>
        </svg>
      </div>
    </div>
    <div class="ch-quote" style="position: absolute; left: 16px; right: 16px; bottom: 26px; font-size: 36px">since the <b>last game</b></div>
  </div>

  <!-- RIGHT: the prize, in gold marker -->
  <div data-fx="panelR" class="ch-panel" style="left: {{ plq.x }}px; top: {{ plq.y }}px; width: {{ plq.w }}px; height: {{ plq.h }}px; transform: rotate(1.5deg)">
    <div class="ch-dither"></div>
    <div class="ch-strip">The prize</div>
    <div data-fx="prize" class="ch-ink" style="position: absolute; left: 14px; right: 14px; top: 110px; font-size: 64px; transform: rotate(-4deg)">GOLDEN<br>TICKET!</div>
    <sc-for list="{{ drips }}" as="d"><div data-fx="drip" class="ch-drip" style="left: {{ d.x }}px; top: {{ d.y }}px; height: {{ d.h }}px"></div></sc-for>
    <div class="ch-quote" style="position: absolute; left: 16px; right: 16px; bottom: 24px; font-size: 38px">“Good work, <b>officer.</b>”</div>
  </div>

  <!-- the one line that says it all -->
  <div data-fx="sub" class="ch-sub" style="position: absolute; left: 60px; width: 1400px; top: {{ subY }}px">{{ sub }}</div>

  <!-- the host's key: there from frame 0, never animated (the app also auto-advances at 6.5s) -->
  <div class="mk-key mk-key--sodium" style="position: absolute; left: 1520px; top: 944px; width: 340px; height: 120px; font-size: 60px; z-index: 5">CONTINUE</div>

  <!-- confetti, front layer (a few bits pass in front of everything) and the gold dust -->
  <div style="position: absolute; inset: 0; pointer-events: none; z-index: 3">
    <sc-for list="{{ bitsF }}" as="b">
      <div data-fx="bit" class="ch-bit" style="width: {{ b.w }}px; height: {{ b.h }}px; background: {{ b.c }}; transform: translate({{ b.x }}px, {{ b.y }}px) rotate({{ b.r }}deg); opacity: {{ b.o }}" data-x="{{ b.x }}" data-d="{{ b.d }}" data-t="{{ b.t }}" data-r="{{ b.r }}" data-s="{{ b.s }}"></div>
    </sc-for>
    <sc-for list="{{ dust }}" as="d"><div data-fx="dust" class="ch-dust" style="left: {{ d.x }}px; top: {{ d.y }}px; opacity: {{ d.o }}" data-p="{{ d.p }}"></div></sc-for>
  </div>

  <div class="mk-grit" style="opacity: .12; z-index: 4"></div>
  <div style="position: absolute; inset: 0; pointer-events: none; z-index: 4; background: url('/public/textures/grain.png') 0 0 / 256px 256px; opacity: .05"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"n":{"editor":"enum","options":[1,2,3],"default":1,"tsType":"number"},"replay":{"editor":"boolean","default":false,"tsType":"boolean"},"motion":{"editor":"boolean","default":true,"tsType":"boolean"},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  motionOn() { return this.props.motion !== false && !matchMedia('(prefers-reduced-motion: reduce)').matches; }
  componentDidMount() {
    if (!this.motionOn()) return;
    const q = s => [...document.querySelectorAll('[data-fx="' + s + '"]')];
    const A = this._a = [];
    // The moment plays ONCE (~4s, confetti to 6s) and holds; finished animations are committed and cancelled.
    // replay=true (previews only) loops the whole thing with a rest.
    const replay = this.props.replay === true, P = replay ? 8000 : 6000;
    const tl = (el, frames) => {
      if (!el) return;
      const kf = frames.map(([t, p, e]) => ({ ...p, offset: Math.min(1, t / P), ...(e ? { easing: e } : {}) }));
      if (kf[0].offset > 0) kf.unshift({ ...frames[0][1], offset: 0 });
      if (kf[kf.length - 1].offset < 1) kf.push({ ...frames[frames.length - 1][1], offset: 1 });
      const a = el.animate(kf, { duration: P, iterations: replay ? Infinity : 1, fill: 'both' });
      A.push(a);
      if (!replay) a.finished.then(() => { try { a.commitStyles(); } catch (e) {} a.cancel(); }).catch(() => {});
    };
    const loop = (el, k, o) => el && A.push(el.animate(k, { iterations: Infinity, ...o }));
    const tf = v => ({ transform: v }), op = v => ({ opacity: v }), io = 'ease-in-out', pop = 'cubic-bezier(.3,1.5,.5,1)';
    // 0-300: the marquee flicks on (two flashes), 300-700: the kicker, the panels slide in from the sides
    tl(q('marquee')[0], [[0, op(0), 'steps(1,end)'], [100, op(1), 'steps(1,end)'], [170, op(.15), 'steps(1,end)'], [300, op(1)]]);
    tl(q('kicker')[0], [[300, { opacity: 0, transform: 'translateY(14px)' }, 'ease-out'], [650, { opacity: 1, transform: 'translateY(0px)' }]]);
    tl(q('panelL')[0], [[300, tf('translateX(-460px)'), 'cubic-bezier(.2,1.2,.4,1)'], [760, tf('translateX(0px)')]]);
    tl(q('panelR')[0], [[380, tf('translateX(460px) rotate(1.5deg)'), 'cubic-bezier(.2,1.2,.4,1)'], [840, tf('translateX(0px) rotate(1.5deg)')]]);
    // 600-~1700: the counter racks up, fast then slowing (each value is one step of ONE strip)
    const N = this._beers, STEP = this._step, T = this._tick;
    tl(q('segStrip')[0], T.map((t, v) => [t, tf(`translateY(${-v * STEP}px)`), 'steps(1,end)']));
    const tEnd = T[T.length - 1];
    tl(q('segBox')[0], [[tEnd, tf('scale(1)'), 'ease-out'], [tEnd + 90, tf('scale(1.12)'), pop], [tEnd + 330, tf('scale(1)')]]);
    // 1500+: the frames drop in on their chains and swing to rest
    q('col').forEach((col, i) => {
      const t = 1000 + i * 120, one = s => [...col.querySelectorAll('[data-fx="' + s + '"]')];
      tl(one('hang')[0], [[t, tf('translateY(-1100px) rotate(0deg)'), 'cubic-bezier(.5,0,1,.7)'], [t + 380, tf('translateY(0px) rotate(0deg)'), 'ease-out'],
        [t + 470, tf('translateY(-26px) rotate(1.6deg)'), 'ease-in'], [t + 560, tf('translateY(0px) rotate(2.4deg)'), io],
        [t + 760, tf('translateY(0px) rotate(-1.6deg)'), io], [t + 940, tf('translateY(0px) rotate(.8deg)'), io], [t + 1100, tf('translateY(0px) rotate(0deg)')]]);
      // 2300: the rosette slams on
      tl(one('rosette')[0], [[1700 + i * 100, { opacity: 0, transform: 'rotate(-40deg) scale(2.4)' }, pop], [1920 + i * 100, { opacity: 1, transform: 'rotate(-12deg) scale(1)' }]]);
      // 2600-3600: the printer lamp comes on; the ticket feeds out in jerks, then settles with a small drop
      const tp = 1950 + i * 100;
      tl(one('plamp')[0], [[1900 + i * 100, op(0), 'steps(1,end)'], [1940 + i * 100, op(1)]]);
      tl(one('ticket')[0], [[tp, tf('translateY(-100%)'), 'steps(5,end)'], [tp + 520, tf('translateY(-8%)'), 'ease-in'], [tp + 580, tf('translateY(0%)'), 'ease-out'], [tp + 640, tf('translateY(-2%)'), 'ease-in'], [tp + 700, tf('translateY(0%)')]]);
      tl(one('sheen')[0], [[t + 560, { opacity: 1, transform: 'translateX(-120%) skewX(-18deg)' }, 'ease-in-out'], [t + 1160, { opacity: 1, transform: 'translateX(420%) skewX(-18deg)' }, 'steps(1,end)'], [t + 1170, { opacity: 0, transform: 'translateX(420%) skewX(-18deg)' }]]);
      one('glint').forEach((g, k) => { tl(g, [[1000, op(0)], [2400 + k * 300, op(0)]]); });
    });
    // 1850: the spotlight clunks on; the rays fade up
    tl(q('spot')[0], [[1350, op(0), 'steps(1,end)'], [1400, op(1)]]);
    tl(q('raysWrap')[0], [[1400, op(0), 'ease-out'], [1900, op(1)]]);
    loop(q('rays')[0], [{ transform: 'rotate(0deg)' }, { transform: 'rotate(360deg)' }], { duration: 90000, easing: 'linear' });
    // 3500: the marker on the prize plaque stamps in, the drips run
    tl(q('prize')[0], [[2350, { opacity: 0, transform: 'rotate(-4deg) scale(1.6)' }, pop], [2580, { opacity: 1, transform: 'rotate(-4deg) scale(1)' }]]);
    q('drip').forEach((d, i) => tl(d, [[2580 + i * 60, { opacity: 0, transform: 'scaleY(0)' }, 'ease-out'], [3000 + i * 60, { opacity: 1, transform: 'scaleY(1)' }]]));
    q('drip').forEach(d => d.style.transformOrigin = '50% 0');
    // 3800: the subline
    tl(q('sub')[0], [[2750, { opacity: 0, transform: 'translateY(16px)' }, 'ease-out'], [3050, { opacity: 1, transform: 'translateY(0px)' }]]);
    // 2400-6000: the confetti falls once (each bit: translate + spin + a flutter in scaleX), then gone
    q('bit').forEach(b => {
      const x = +b.dataset.x, d = +b.dataset.d, t0 = +b.dataset.t, r = +b.dataset.r, s = +b.dataset.s, dur = 2400 + s * 1400;
      const f = k => `translate(${(x + Math.sin(k * 3 + s * 6) * d).toFixed(1)}px, ${(-60 + k * 1220).toFixed(1)}px) rotate(${(r + k * 540 * (s > .5 ? 1 : -1)).toFixed(0)}deg) scaleX(${Math.cos(k * 9 + s * 4).toFixed(2)})`;
      const fr = [0, .2, .4, .6, .8, 1].map(k => [t0 + k * dur, { transform: f(k), opacity: k === 0 ? 0 : k === 1 ? 0 : 1 }]);
      fr.unshift([t0 - 1, { transform: f(0), opacity: 0 }]);
      tl(b, fr);
    });
    // at rest the dust glints, each on its own slow cycle
    q('dust').forEach((d, i) => { d.style.opacity = 0; loop(d, [{ opacity: 0, transform: 'scale(.4)' }, { opacity: .9, transform: 'scale(1)', offset: .5 }, { opacity: 0, transform: 'scale(.4)' }], { duration: +d.dataset.p, delay: 1900 + i * 170, easing: io }); });
  }
  componentWillUnmount() { (this._a || []).forEach(a => a.cancel()); }
  renderVals() {
    const K = window.MachineKit, f1 = v => +v.toFixed(1), rnd = K.rnd;
    const motion = this.motionOn();
    const n = Math.max(1, Math.min(3, Math.round(+this.props.n || 1)));
    const beers = [0, 9, 7, 6][n];
    const who = [[4], [0, 6], [2, 3, 7]][n - 1].map(i => K.player(i));

    // ---- the columns: frame (square) + plate + printer + ticket, centred between the side panels
    const ph = [0, 300, 250, 214][n], fw = ph + 2 * (30 + 12), gap = [0, 0, 90, 46][n];
    const plH = n === 1 ? 84 : 76, tkH = 132;
    const colH = fw - 12 + plH + 16 + 44 + tkH;
    const top = Math.round(262 + Math.max(0, (680 - colH) / 2));
    const total = n * fw + (n - 1) * gap, x0 = Math.round(960 - total / 2);
    const cols = who.map((p, i) => {
      const plW = fw - 36, prW = fw - 24, tkW = Math.min(fw + gap - 28, fw + 30, 420), prY = fw - 12 + plH + 12;
      return { p, i, fw, x: x0 + i * (fw + gap), y: top, hangH: fw - 12 + plH,
        wire: `M${f1(fw * .2)} 62 L${f1(fw * .5)} 8 L${f1(fw * .8)} 62`,
        plX: 18, plW, plH, forFs: n === 3 ? 20 : 24, nameFs: Math.min(n === 1 ? 72 : 64, Math.floor(plW / (p.name.length * .5 + .6))),
        ro: n === 1 ? 150 : 120, roX: n === 1 ? -56 : -40, roY: n === 1 ? -26 : -22,
        prX: 12, prY, prW, tkX: Math.round((fw - tkW) / 2), tkW, tkH, tkB: Math.min(58, Math.floor((tkW - 64) / 5.6)) };
    });
    const colTop = top, colBottom = top + colH;
    const rays = (() => { const k = 28, pts = []; for (let i = 0; i < k; i++) { const a0 = (i / k) * Math.PI * 2, w = Math.PI / k * .55; pts.push(`M0 0L${f1(Math.cos(a0 - w) * 900)} ${f1(Math.sin(a0 - w) * 900)}L${f1(Math.cos(a0 + w) * 900)} ${f1(Math.sin(a0 + w) * 900)}Z`); } return { d: pts.join(''), x: 960, y: 90 }; })();
    const spot = { l: x0 - 140, r: x0 + total + 140 };
    // the rosette: a pleated gold ring
    const rosetteD = (() => { const k = 32, pts = []; for (let i = 0; i < k * 2; i++) { const a = (i / (k * 2)) * Math.PI * 2, r = i % 2 ? 80 : 94; pts.push(`${f1(Math.cos(a) * r)} ${f1(Math.sin(a) * r)}`); } return 'M' + pts.join('L') + 'Z'; })();

    // ---- the gold marquee (static, centred)
    const pitch = 12, text = n > 1 ? 'BIGGEST CHAMPS!' : 'BIGGEST CHAMP!';
    const m = K.marquee(text, pitch), screenCols = m.textCols + 12;
    const mq = { pitch, m, text, screenW: screenCols * pitch, screenH: m.height, left: 6 * pitch };
    mq.x = Math.round(960 - (mq.screenW + 44) / 2);

    // ---- the counter: a ghost "88" and a strip of every value 00..N
    const STEP = 130; this._step = STEP; this._beers = beers;
    const S = t => K.segments(t, { h: 100 });
    const vals = motion ? [...Array(beers + 1).keys()] : [beers];
    const g = S('88');
    const seg = { ghost: g.lit, vw: g.width, layers: vals.map((v, i) => ({ lit: S(String(v).padStart(2, '0')).lit, y: i * STEP })), stripY: motion ? -beers * STEP : 0 };
    seg.h = 170; seg.w = Math.round(seg.vw * seg.h / 112);
    // ticks: 600ms -> 1650ms, easing out (the last beers land slower)
    this._tick = [...Array(beers + 1).keys()].map(v => Math.round(400 + 800 * (1 - Math.pow(1 - v / beers, 2))));

    const con = { x: 60, y: 300, w: 360, h: 380 }, plq = { x: 1500, y: 300, w: 360, h: 380 };
    const drips = [{ x: 96, y: 176, h: 20 }, { x: 196, y: 180, h: 36 }, { x: 292, y: 172, h: 14 }];
    // the headline: WHO, and WHAT HAPPENS NOW, readable at a glance
    const names = who.map(p => p.name), list = names.length > 1 ? names.slice(0, -1).join(', ') + ' & ' + names[names.length - 1] : names[0];
    const sub = n > 1 ? `${list} SKIP THEIR NEXT PUNISHMENT` : `${list} SKIPS THEIR NEXT PUNISHMENT`;
    const subY = Math.min(990, colBottom + 30);

    // ---- confetti: 90 bits; the still shows them frozen mid-fall
    const golds = ['#ffd84a', '#fff0b0', '#e0b458', '#c9a227', '#f5d77a', '#b8841e', '#fff8e0'];
    const bits = Array.from({ length: 90 }, (_, i) => {
      const s = rnd(i + 200), x = f1(rnd(i + 300) * 1900), y = f1(60 + rnd(i + 400) * 940);
      return { w: Math.round(10 + rnd(i + 500) * 10), h: Math.round(16 + rnd(i + 600) * 14), c: golds[i % golds.length],
        x, y, r: Math.round(rnd(i + 700) * 360), front: i % 4 === 0,
        d: Math.round(20 + rnd(i + 800) * 60), t: Math.round(1750 + rnd(i + 900) * 900), s: s.toFixed(2) };
    });
    // the still: back bits show anywhere (content covers them); front bits only where they cover no words
    const busy = [[340, 0, 1580, 225], [40, 280, 440, 700], [1480, 280, 1880, 700], [x0 - 70, top - 40, x0 + total + 10, colBottom + 10], [60, subY - 10, 1860, subY + 70], [1500, 930, 1880, 1080]];
    const clear = b => !busy.some(([l, t, r, btm]) => b.x > l - 30 && b.x < r && b.y > t - 30 && b.y < btm);
    const bare = [[340, 170, 1580, 225], [60, subY - 10, 1480, subY + 70], [1480, 910, 1920, 1080]];   // text with no plate behind it: no bits at all
    const open = b => !bare.some(([l, t, r, btm]) => b.x > l - 30 && b.x < r && b.y > t - 30 && b.y < btm);
    bits.forEach(b => { b.o = motion ? 0 : ((!b.front || clear(b)) && open(b) ? .95 : 0); });
    const bitsB = bits.filter(b => !b.front), bitsF = bits.filter(b => b.front);
    const dust = Array.from({ length: 26 }, (_, i) => ({ x: f1(x0 - 60 + rnd(i + 1000) * (total + 120)), y: f1(top - 20 + rnd(i + 1100) * (fw + 60)), p: Math.round(1800 + rnd(i + 1200) * 1600), o: motion ? 0 : (rnd(i + 1300) > .6 ? .8 : 0) }));

    return {
      rootClass: motion ? 'mk-motion' : '', face: K.FACE,
      cols, rays, spot, rosetteD, mq, seg, con, plq, drips, sub, subY, bitsB, bitsF, dust, beers,
      kicker: 'MOST BEERS LOGGED SINCE THE LAST GAME',
    };
  }
}
