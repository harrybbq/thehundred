<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Walk the Plank on the TV</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&amp;family=IM+Fell+English+SC&amp;family=Big+Shoulders+Display:wght@800;900&amp;family=Big+Shoulders+Stencil+Display:wght@900&amp;family=Courier+Prime:wght@400;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#020607}</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; color: #e6f2ee; font-family: 'Courier Prime', monospace; background: linear-gradient(180deg, #071c22, #0d323a 40%, #16474f 43.5%, #0b3640 44%, #062a32 62%, #02141a)">

  <svg width="0" height="0" style="position: absolute">
    <defs>
      <filter id="pl-grain" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.004 0.22" numOctaves="3" seed="9"></feTurbulence>
        <feColorMatrix values="0 0 0 0 0.12  0 0 0 0 0.06  0 0 0 0 0.02  0 0 0 2.4 -1.1"></feColorMatrix><feComposite in2="SourceAlpha" operator="in"></feComposite>
      </filter>
      <filter id="pl-film" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="2"></feTurbulence>
        <feColorMatrix values="0 0 0 0 0.8  0 0 0 0 0.95  0 0 0 0 0.9  0 0 0 2.2 -1.25"></feColorMatrix>
      </filter>
      <pattern id="pl-boards" width="480" height="46" patternUnits="userSpaceOnUse">
        <rect width="480" height="46" fill="#4a3020"></rect>
        <rect width="480" height="3" fill="#6d4a30" opacity=".6"></rect>
        <rect y="42" width="480" height="4" fill="#120a05"></rect>
        <rect x="236" y="0" width="3" height="46" fill="#120a05"></rect>
        <circle cx="20" cy="22" r="3" fill="#1a120c"></circle><circle cx="252" cy="22" r="3" fill="#1a120c"></circle>
        <circle cx="20" cy="21" r="1.2" fill="#8a7a66"></circle><circle cx="252" cy="21" r="1.2" fill="#8a7a66"></circle>
      </pattern>
      <linearGradient id="pl-plank" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#9a7048"></stop>
        <stop offset=".35" stop-color="#7a5530"></stop>
        <stop offset="1" stop-color="#3a2414"></stop>
      </linearGradient>
      <linearGradient id="pl-tent" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0" stop-color="#1a0a14"></stop>
        <stop offset=".55" stop-color="#4a2436"></stop>
        <stop offset="1" stop-color="#7a4456"></stop>
      </linearGradient>
      <radialGradient id="pl-lantern" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0" stop-color="#ffcf8a" stop-opacity=".55"></stop>
        <stop offset=".4" stop-color="#ff8a1e" stop-opacity=".18"></stop>
        <stop offset="1" stop-color="#ff8a1e" stop-opacity="0"></stop>
      </radialGradient>
    </defs>
  </svg>

  <!-- sky: stars, the moon and its halo -->
  <sc-for list="{{ stars }}" as="s" hint-placeholder-count="20">
    <div style="position: absolute; left: {{ s.x }}px; top: {{ s.y }}px; width: {{ s.r }}px; height: {{ s.r }}px; border-radius: 50%; background: #dff3ee; opacity: {{ s.o }}"></div>
  </sc-for>
  <div style="position: absolute; left: 1110px; top: -70px; width: 480px; height: 480px; border-radius: 50%; background: radial-gradient(circle, rgba(220,245,238,.30), rgba(120,210,200,.08) 45%, transparent 70%)"></div>
  <div style="position: absolute; left: 1286px; top: 106px; width: 128px; height: 128px; border-radius: 50%; background: radial-gradient(circle at 38% 36%, #f6fbf8, #d4e6e0 60%, #a9c4bd); box-shadow: 0 0 40px rgba(230,250,244,.6)">
    <div style="position: absolute; left: 28px; top: 40px; width: 22px; height: 18px; border-radius: 50%; background: rgba(120,150,145,.35)"></div>
    <div style="position: absolute; left: 70px; top: 70px; width: 30px; height: 24px; border-radius: 50%; background: rgba(120,150,145,.3)"></div>
  </div>

  <!-- the sea: moonlight glitter, three wave depths, fog on the horizon -->
  <sc-for list="{{ glitter }}" as="g" hint-placeholder-count="30">
    <div data-fx="glint" style="position: absolute; left: {{ g.x }}px; top: {{ g.y }}px; width: {{ g.w }}px; height: {{ g.h }}px; border-radius: 50%; background: #e8f7f2; opacity: {{ g.o }}"></div>
  </sc-for>
  <sc-for list="{{ waves }}" as="w" hint-placeholder-count="3">
    <svg data-fx="wave" data-speed="{{ w.speed }}" viewBox="0 0 3840 {{ w.h }}" preserveAspectRatio="none" style="position: absolute; left: 0; top: {{ w.y }}px; width: 3840px; height: {{ w.h }}px; pointer-events: none">
      <path d="{{ w.fill }}" fill="{{ w.color }}" opacity="{{ w.o }}"></path>
      <path d="{{ w.crest }}" stroke="rgba(200,250,245,{{ w.c }})" stroke-width="{{ w.sw }}" fill="none"></path>
    </svg>
  </sc-for>
  <div data-fx="fog" style="position: absolute; left: -200px; right: -200px; top: 430px; height: 110px; background: radial-gradient(ellipse 30% 50% at 30% 50%, rgba(170,210,205,.22), transparent 70%), radial-gradient(ellipse 35% 45% at 75% 55%, rgba(170,210,205,.16), transparent 70%); filter: blur(12px)"></div>

  <!-- the Kraken: eyes under the water, tentacles rising where someone is close to the edge -->
  <sc-for list="{{ eyes }}" as="e" hint-placeholder-count="2">
    <div style="position: absolute; left: {{ e.x }}px; top: {{ e.y }}px; width: {{ e.w }}px; height: {{ e.h }}px; border-radius: 50%; background: radial-gradient(ellipse, #fff7c2 0 12%, #ffcf5a 30%, rgba(255,160,40,.35) 60%, transparent 72%); opacity: {{ e.o }}">
      <div style="position: absolute; left: 46%; top: 16%; width: 8%; height: 68%; border-radius: 50%; background: #1a0a06"></div>
    </div>
  </sc-for>
  <sc-for list="{{ tentacles }}" as="t" hint-placeholder-count="3">
    <svg viewBox="0 0 160 340" style="position: absolute; left: {{ t.x }}px; top: {{ t.y }}px; width: {{ t.w }}px; height: {{ t.h }}px; overflow: visible; transform: {{ t.tf }}; transform-origin: 50% 100%">
      <path d="{{ tentD }}" fill="url(#pl-tent)" stroke="#12060c" stroke-width="3"></path>
      <path d="{{ tentSheen }}" stroke="#d7a7b4" stroke-width="5" stroke-linecap="round" fill="none" opacity=".45"></path>
      <sc-for list="{{ suckers }}" as="k"><circle cx="{{ k.x }}" cy="{{ k.y }}" r="{{ k.r }}" fill="#e2c1bc" stroke="#3a1f2e" stroke-width="1.5"></circle><circle cx="{{ k.x }}" cy="{{ k.y }}" r="{{ k.ri }}" fill="#8a5a62"></circle></sc-for>
      <sc-for list="{{ t.drips }}" as="d"><ellipse cx="{{ d.x }}" cy="{{ d.y }}" rx="2.5" ry="5" fill="#bfe9e2" opacity=".7"></ellipse></sc-for>
    </svg>
  </sc-for>
  <sc-for list="{{ churns }}" as="c" hint-placeholder-count="1">
    <div style="position: absolute; left: {{ c.x }}px; top: {{ c.y }}px; width: {{ c.w }}px; height: 60px; border-radius: 50%; background: radial-gradient(ellipse, rgba(220,255,250,.45), transparent 70%); filter: blur(4px)"></div>
  </sc-for>

  <!-- the ship: the stern of a galleon seen from astern, lit gallery windows, gilt carving,
       stern chasers and a rudder; the planks come out of gunports on the starboard quarter -->

<script type="text/x-dc" data-dc-script data-props='{"moment":{"editor":"enum","options":["live","reveal"],"default":"live","tsType":"string"},"motion":{"editor":"boolean","default":true,"tsType":"boolean"},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  componentDidMount() {

    this._a = [];
    q('wave').forEach(el => this._a.push(el.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-1920px)' }], { duration: +el.dataset.speed || 20000, iterations: Infinity })));
    q('glint').forEach((el, i) => this._a.push(el.animate([{ opacity: .1 }, { opacity: .9 }, { opacity: .1 }], { duration: 900 + (i % 5) * 260, delay: (i * 137) % 1200, iterations: Infinity })));

    q('fog').forEach(el => this._a.push(el.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(120px)' }], { duration: 14000, iterations: Infinity, direction: 'alternate' })));
  }
  componentWillUnmount() { (this._a || []).forEach(a => a.cancel()); }
  renderVals() {
    const reveal = (this.props.moment ?? 'live') === 'reveal';
    const rnd = i => { const v = Math.sin(i * 12.9898 + 7.3) * 43758.5453; return v - Math.floor(v); };
    const f1 = n => n.toFixed(1);
    // three planks off one hull, back to front (smaller and hazier further back)
    const P = [
      { name: 'MAYA', y: 452, L: 640, t: 11, s: .55, pos: 64, stopped: true, photo: 1 },
      { name: 'KAI', y: 612, L: 960, t: 17, s: .75, pos: 88, stopped: false, photo: 0 },
      { name: 'TOM', y: 826, L: 1280, t: 27, s: 1, pos: 46, stopped: false, photo: 1 },
    ];
    const photo = i => i
      ? 'radial-gradient(circle at 50% 38%, #e8c9a0 0 17%, transparent 18%), radial-gradient(ellipse 46% 40% at 50% 98%, #caa57a 0 62%, transparent 63%), linear-gradient(200deg, #ffb866, #a84a00 55%, #2a1406)'
      : 'radial-gradient(circle at 50% 38%, #b9c3bf 0 17%, transparent 18%), radial-gradient(ellipse 46% 40% at 50% 98%, #8fa09d 0 62%, transparent 63%), linear-gradient(160deg, #2c6e74, #0f3a41 55%, #06191d)';
    const x0 = 398;
    const LIVE_POS = 74;                                   // everyone walks the same curve: nobody's stop shows until the reveal
    const planks = P.map((p, i) => {
      const u = (reveal ? p.pos : LIVE_POS) / 100, sag = 90 * p.s * Math.pow(u, 2.2), L = p.L, t = p.t;
      const X = k => x0 + L * (1.2 * k * (1 - k) + k * k), Y = k => p.y + k * k * sag;
      const cx = x0 + L * .6, tx = x0 + L, ty = p.y + sag;
      const d = `M ${x0} ${p.y} Q ${f1(cx)} ${p.y} ${f1(tx)} ${f1(ty)} L ${f1(tx)} ${f1(ty + t)} Q ${f1(cx)} ${p.y + t} ${x0} ${p.y + t} Z`;
      const shadow = `M ${x0} ${p.y + t + 18} Q ${f1(cx)} ${p.y + t + 26} ${f1(tx - 20)} ${f1(ty + t + 30)} L ${f1(tx - 20)} ${f1(ty + t + 44)} Q ${f1(cx)} ${p.y + t + 40} ${x0} ${p.y + t + 32} Z`;
      const k0 = .86, dx0 = X(k0), dy0 = Y(k0);
      const danger = `M ${f1(dx0)} ${f1(dy0)} Q ${f1((dx0 + tx) / 2)} ${f1((dy0 + ty) / 2 - 2)} ${f1(tx)} ${f1(ty)} L ${f1(tx)} ${f1(ty + t)} L ${f1(dx0)} ${f1(dy0 + t)} Z`;
      const figW = Math.round(124 * p.s), figH = Math.round(146 * p.s);
      const px = X(u), py = Y(u);
      const slope = Math.atan2(2 * u * sag, L * (1.2 - 2.4 * u + 2 * u + .0001)) * 180 / Math.PI;
      const nails = [.08, .3, .55, .8].map(k => ({ x: f1(X(k)), y: f1(Y(k) + t * .5), r: f1(1.5 + p.s * 1.5) }));
      return {
        d, shadow, danger: reveal ? '' : danger, nails,
        tipX: f1(tx), tipY: f1(ty + t / 2), tipRx: f1(3 + t * .18), tipRy: f1(t / 2),
        figX: Math.round(px - figW / 2), figY: Math.round(py - figH + 2), figW, figH, tilt: f1(slope),
        pad: `${Math.round(6 * p.s)}px ${Math.round(6 * p.s)}px ${Math.round(18 * p.s)}px`,
        photo: photo(p.photo), bobFx: reveal ? 'still' : 'bob',
        haze: i === 0 ? 'saturate(.7) brightness(.72) blur(.6px)' : i === 1 ? 'saturate(.88) brightness(.88)' : 'none',
        _tx: tx, _ty: ty, _px: px, _py: py, _figH: figH, _s: p.s,
      };
    });
    // tentacle geometry (after the original TV-22 design), plus a wet highlight down its spine
    const tent = (N, f) => { const Lp = [], Rp = [], S = [], C = []; for (let k = 0; k <= N; k++) { const q = k / N, [x, y, a] = f(q), w = 30 * (1 - q) + 3; Lp.push([x - Math.cos(a) * w, y - Math.sin(a) * w]); Rp.push([x + Math.cos(a) * w, y + Math.sin(a) * w]); C.push([x - Math.cos(a) * w * .35, y - Math.sin(a) * w * .35]); if (k % 3 === 1 && q < .88) { const r = Math.max(2, w * .28); S.push({ x: Math.round(x + Math.cos(a) * w * .45), y: Math.round(y + Math.sin(a) * w * .45), r: f1(r), ri: f1(r * .45) }); } } const pts = Lp.concat(Rp.reverse()); return { d: 'M ' + pts.map(pp => pp.map(f1).join(' ')).join(' L ') + ' Z', S, sheen: 'M ' + C.slice(2, -4).map(pp => pp.map(f1).join(' ')).join(' L ') }; };
    const up = tent(30, q => { const y = 340 - q * 330, x = 70 + Math.sin(q * 5.2) * 26 * q; const dxdt = 26 * Math.sin(q * 5.2) + 26 * q * 5.2 * Math.cos(q * 5.2); return [x, y, Math.atan2(dxdt, 330)]; });
    const curl = tent(40, q => { if (q < .55) { const y = 420 - q / .55 * 250; return [100 + Math.sin(q * 6) * 8, y, 0]; } const v = (q - .55) / .45, ang = Math.PI - v * Math.PI * 1.7; return [160 + Math.cos(ang) * 60 * (1 - v * .35), 170 - Math.sin(ang) * 60 * (1 - v * .35), -ang]; });
    // live: the Kraken rises evenly at every tip, scaled by depth (the shared position drives it, never a player's stop);
    // on reveal it takes Tom, who stopped furthest from the edge
    const tentacles = reveal ? [] : planks.flatMap(p => {
      const k = p._s;
      return [
        { x: Math.round(p._tx - 70 * k), y: Math.round(p._ty - 150 * k), w: Math.round(120 * k), h: Math.round(255 * k), tf: 'rotate(-8deg)', drips: [{ x: 60, y: 60 }, { x: 88, y: 140 }] },
        { x: Math.round(p._tx + 60 * k), y: Math.round(p._ty - 90 * k), w: Math.round(100 * k), h: Math.round(212 * k), tf: 'scaleX(-1) rotate(-6deg)', drips: [{ x: 70, y: 110 }] },
      ];
    });
    const eyes = reveal ? [
      { x: 900, y: 956, w: 90, h: 44, o: .9 }, { x: 1010, y: 960, w: 90, h: 44, o: .9 },
    ] : [
      { x: Math.round(planks[2]._tx - 30), y: Math.round(planks[2]._ty + 110), w: 64, h: 30, o: .7 }, { x: Math.round(planks[2]._tx + 50), y: Math.round(planks[2]._ty + 114), w: 64, h: 30, o: .7 },
    ];
    const churns = reveal ? [{ x: Math.round(planks[2]._px - 180), y: 930, w: 420 }] : planks.map(p => ({ x: Math.round(p._tx - 150 * p._s), y: Math.round(p._ty + 80 * p._s), w: Math.round(300 * p._s) }));
    const waveOf = (y, h, amp, per, color, o, c, sw, speed) => {
      let fill = `M 0 ${h}`, crest = '';
      for (let x = 0; x <= 3840; x += 20) { const yy = amp + Math.sin(x / per * Math.PI * 2) * amp; fill += ` L ${x} ${f1(yy)}`; crest += (x ? ' L ' : 'M ') + x + ' ' + f1(yy); }
      return { y, h, fill: fill + ` L 3840 ${h} Z`, crest, color, o, c, sw, speed };
    };
    const waves = [
      waveOf(486, 140, 4, 96, '#0f4550', .8, .16, 1.5, 38000),
      waveOf(640, 200, 9, 192, '#0a3a44', .75, .22, 2, 26000),
      waveOf(880, 220, 16, 320, '#062a32', .85, .3, 3, 16000),

      { x: Math.round(planks[0]._tx - 60), y: Math.round(planks[0]._ty + 26), r: 3, text: '64 · safe' },
      { x: Math.round(planks[1]._tx - 70), y: Math.round(planks[1]._ty + 34), r: -2, text: '88 · safe' },
    ] : [];
    const front = planks[2];
    return {
      isLive: !reveal, isReveal: reveal, planks, tentacles, eyes, churns, waves, glitter, stars, fogged, tags,
      tentD: up.d, tentSheen: up.sheen, suckers: up.S, curlD: curl.d, curlSheen: curl.sheen, curlSuck: curl.S,

      hullNames: planks.map((p, i) => ({ name: P[i].name, x: Math.round(446 + 30 * P[i].s), y: Math.round(P[i].y - 14 - 40 * P[i].s), s: Math.round(20 + 18 * P[i].s), o: i === 0 ? .7 : .9 })),
      kicker: reveal ? 'The Kraken has fed' : 'The Kraken wants a sacrifice',
      caption: reveal ? 'Tom stopped furthest from the edge. The Kraken takes him.' : 'Nobody sees where anyone stopped until the end.',
