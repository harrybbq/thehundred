<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mugshots</title>
<script src="./support.js"></script>
<script src="./mugshots.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&amp;family=Courier+Prime:wght@400;700&amp;family=Special+Elite&amp;family=IM+Fell+English&amp;family=Permanent+Marker&amp;display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#2a2622}
  .mg-sheet{width:2520px;padding:60px 60px 80px;box-sizing:border-box;background:#f4efe6;color:#1a1714;font-family:'Courier Prime',monospace}
  .mg-sheet h1{font-family:'Big Shoulders Display',Impact,sans-serif;font-weight:900;font-size:72px;letter-spacing:.04em;margin:0}
  .mg-sheet .sub{font-size:22px;margin:6px 0 40px;max-width:1800px;line-height:1.4}
  .mg-grid{display:grid;grid-template-columns:repeat(5,450px);gap:36px 30px}
  .mg-cell figure{margin:0}
  .mg-art{width:450px;height:550px;background:#fff;border:3px solid #1a1714;box-sizing:content-box}
  .mg-art svg{display:block;width:100%;height:100%}
  .mg-cell figcaption{font-family:'Special Elite',monospace;font-size:24px;margin-top:8px;display:flex;justify-content:space-between}
  .mg-cell figcaption b{font-family:'Courier Prime',monospace;font-size:18px;opacity:.6}
  .mg-strip-h{font-family:'Big Shoulders Display',Impact,sans-serif;font-weight:900;font-size:40px;margin:70px 0 6px}
  .mg-strip{display:flex;flex-wrap:wrap;gap:14px;background:#fff;padding:20px;border:2px dashed #888}
  .mg-strip .mg-art{width:170px;height:208px;border-width:2px}
  .mg-gray .mg-art{filter:grayscale(1)}
</style>
</helmet>
<!--
  MUGSHOTS review sheet: all 14 role mugshots at full drawing size (450x550 viewBox), then the same set at
  printed card size (45x55mm = 170x208px at 96dpi) and again in pure greyscale, to judge readability and B&W printing.
-->
<div class="mg-sheet">
  <h1>MUGSHOTS · THE HUNDRED ROLE CARDS</h1>
  <p class="sub">One booking photo per role: front view, height chart, placard. Line art and hatching in one ink, one spot colour per role as a light tint. Below: the real printed size, in colour and in black-and-white.</p>
  <div class="mg-grid">
    <sc-for list="{{ roles }}" as="r">
      <div class="mg-cell"><figure><div class="mg-art" data-mug="{{ r.key }}"></div><figcaption><span>{{ r.label }}</span></figcaption></figure></div>
    </sc-for>
  </div>
  <div class="mg-strip-h">AT CARD SIZE (45 × 55 mm)</div>
  <div class="mg-strip">
    <sc-for list="{{ roles }}" as="r"><div class="mg-art" data-mug="{{ r.key }}"></div></sc-for>
  </div>
  <div class="mg-strip-h">AT CARD SIZE, BLACK INK ONLY</div>
  <div class="mg-strip mg-gray">
    <sc-for list="{{ roles }}" as="r"><div class="mg-art" data-mug="{{ r.key }}"></div></sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2520,"height":3000}}'>
class Component extends DCLogic {
  componentDidMount() {
    // the renderer escapes {{ }} text, so the SVG strings go in here
    for (const el of document.querySelectorAll('[data-mug]')) el.innerHTML = window.MUGSHOTS[el.dataset.mug] || '';
  }
  renderVals() {
    const order = window.MUGSHOT_ORDER, lab = window.MUGSHOT_LABEL;
    return { roles: order.map((key, i) => ({ key, label: lab[key] })) };
  }
}
</script>
</body>
</html>
