<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Role Cards</title>
<script src="./support.js"></script>
<script src="./mugshots.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&amp;family=Courier+Prime:wght@400;700&amp;family=Special+Elite&amp;family=IM+Fell+English&amp;family=Permanent+Marker&amp;display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#fff}
  /* one A4 sheet, 4 cards, dashed cut lines (same sheet geometry as src/styles/cards.css) */
  .sheet{width:210mm;height:297mm;box-sizing:border-box;padding:8mm;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;background:#fff;color:#000}
  .sheet.gray{filter:grayscale(1)}
  .role-card{border:1px dashed #888;padding:5mm 5.5mm 3.5mm;display:flex;flex-direction:column;gap:2.2mm;font-family:'Courier Prime','Courier New',monospace;min-width:0;min-height:0;overflow:hidden}
  .rc-top{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #000;padding-bottom:1.3mm}
  .rc-top span{font-family:'Special Elite',monospace;font-size:10.5pt;letter-spacing:.06em}
  .rc-top b{font-size:9.5pt}
  /* the booking row: a 45 x 55 mm mugshot, the file details beside it */
  .rc-id{display:grid;grid-template-columns:45mm 1fr;gap:3.5mm;height:55mm;flex-shrink:0}
  .rc-frame{width:45mm;height:55mm;box-sizing:border-box;border:2px solid #000;background:#fff;overflow:hidden}
  .rc-frame svg{display:block;width:100%;height:100%}
  .rc-meta{min-width:0;display:flex;flex-direction:column;gap:1.4mm}
  .rc-subj{font-size:8.6pt;font-weight:700;letter-spacing:.18em;line-height:1.45}
  .rc-role{font-family:'Special Elite',monospace;font-size:17pt;line-height:1.02;overflow-wrap:anywhere}
  .rc-team{font-size:8.6pt;font-weight:700;letter-spacing:.14em}
  .rc-conf{align-self:flex-start;font-family:'Special Elite',monospace;font-size:10pt;border:3px double #000;padding:0 1.6mm;transform:rotate(-5deg);margin-top:.6mm}
  .rc-badges{margin-top:auto;display:flex;gap:2mm;min-height:17mm;align-items:flex-end}
  .rc-badge{width:16mm;display:flex;flex-direction:column;align-items:center;gap:.4mm;transform:rotate(-4deg)}
  .rc-badge + .rc-badge{transform:rotate(5deg)}
  .rc-badge svg{width:13mm;height:13mm;display:block}
  .rc-badge b{font-size:6.2pt;letter-spacing:.12em}
  .rc-text{font-size:9.9pt;line-height:1.34;margin:0;flex:1}
  .rc-text.love{font-size:9.4pt;line-height:1.3}
  .rc-text.both{font-size:8.6pt;line-height:1.24}
  .rc-mod{margin:0;font-size:8pt;line-height:1.22;font-weight:700;border:1.6px dashed #000;padding:.8mm 1.6mm;display:flex;gap:1.6mm;align-items:flex-start}
  .rc-mod svg{width:4.6mm;height:4.6mm;flex-shrink:0;margin-top:.3mm}
  .rc-bottom{display:flex;align-items:center;gap:3mm;flex-shrink:0}
  .rc-code{font-weight:700;font-size:19pt;letter-spacing:.1em;border:2px solid #000;padding:0 2.4mm;box-shadow:.9mm .9mm 0 #000;white-space:nowrap}
  .rc-code-side{flex:1;min-width:0}
  .rc-code-label{font-size:7.8pt;font-weight:700;letter-spacing:.18em;white-space:nowrap}
  .rc-foot{font-size:7pt;line-height:1.28;margin-top:.4mm}
</style>
</helmet>
<!--
  ROLE CARDS with mugshots: one A4 page (794 x 1123 px), four cards. Every card has the same skeleton and the same
  45 x 55 mm mugshot frame, so a glance across the table gives nothing away; only the art, the name and the blurb differ.
  Modifiers are drawn stamps in the empty corner of the file details (the details column is empty on plain cards),
  plus their rule line under the blurb. Props: roles (comma list), lovebird / cursed (put the badge on cards 1+3 /
  cards 1+2, so card 1 shows the worst case: both), gray (renders the page in greyscale, as a B&W printer would).
-->
<div class="sheet {{ grayClass }}">
  <sc-for list="{{ cards }}" as="c">
    <div class="role-card">
      <div class="rc-top"><span>THE HUNDRED · 10 OCTOBER</span><b>FILE 100</b></div>
      <div class="rc-id">
        <div class="rc-frame" data-mug="{{ c.key }}"></div>
        <div class="rc-meta">
          <div class="rc-subj">SUBJECT: YOU<br>ROLE:</div>
          <div class="rc-role">{{ c.label }}</div>
          <div class="rc-team">TEAM: {{ c.team }}</div>
          <div class="rc-conf">CONFIDENTIAL</div>
          <div class="rc-badges">
            <sc-if value="{{ c.lovebird }}"><div class="rc-badge"><span data-badge="lovebird"></span><b>LOVEBIRD</b></div></sc-if>
            <sc-if value="{{ c.cursed }}"><div class="rc-badge"><span data-badge="cursed"></span><b>CURSED</b></div></sc-if>
          </div>
        </div>
      </div>
      <p class="rc-text {{ c.textClass }}">{{ c.text }}</p>
      <sc-if value="{{ c.lovebird }}"><p class="rc-mod"><span data-icon="lovebird"></span><span>{{ modLove }}</span></p></sc-if>
      <sc-if value="{{ c.cursed }}"><p class="rc-mod"><span data-icon="cursed"></span><span>{{ modCursed }}</span></p></sc-if>
      <div class="rc-bottom">
        <div class="rc-code">{{ c.code }}</div>
        <div class="rc-code-side"><div class="rc-code-label">YOUR SECRET CODE</div><div class="rc-foot">Enter it at {{ site }}/join · single use · keep this card hidden</div></div>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"roles":{"editor":"string","default":"betrayer,scrooge,jester,davyjones","tsType":"string"},"lovebird":{"editor":"boolean","default":false,"tsType":"boolean"},"cursed":{"editor":"boolean","default":false,"tsType":"boolean"},"gray":{"editor":"boolean","default":false,"tsType":"boolean"},"$preview":{"width":794,"height":1123}}'>
class Component extends DCLogic {
  componentDidMount() {
    const INK = '#1a1714';
    // the two modifier stamps, drawn in the same line-and-hatch style as the mugshots
    const heart = 'M50 40 C50 26 30 22 26 36 C22 50 38 60 50 72 C62 60 78 50 74 36 C70 22 50 26 50 40 Z';
    const BADGE = {
      lovebird: `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#fff" stroke="${INK}" stroke-width="5"/><circle cx="50" cy="50" r="38" fill="none" stroke="${INK}" stroke-width="2"/>
        <path d="${heart}" fill="#9e2f42" fill-opacity=".5" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/>
        <path d="M22 70 L80 34" stroke="${INK}" stroke-width="4" stroke-linecap="round"/><path d="M80 34 L70 34 M80 34 L76 43 M22 70 L16 66 M22 70 L20 76" stroke="${INK}" stroke-width="3" stroke-linecap="round"/></svg>`,
      cursed: `<svg viewBox="0 0 100 100"><defs><pattern id="bdx" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V5M0 0H5" stroke="${INK}" stroke-width="1.6"/></pattern></defs>
        <circle cx="50" cy="50" r="46" fill="#fff" stroke="${INK}" stroke-width="5"/><circle cx="50" cy="50" r="38" fill="none" stroke="${INK}" stroke-width="2"/>
        <path d="M28 46 C28 28 38 20 50 20 C62 20 72 28 72 46 C72 54 68 58 64 60 L64 70 L36 70 L36 60 C32 58 28 54 28 46 Z" fill="#fff" stroke="${INK}" stroke-width="4.5" stroke-linejoin="round"/>
        <ellipse cx="41" cy="46" rx="7" ry="8" fill="url(#bdx)" stroke="${INK}" stroke-width="3"/><ellipse cx="59" cy="46" rx="7" ry="8" fill="url(#bdx)" stroke="${INK}" stroke-width="3"/>
        <path d="M50 54 L46 61 L54 61 Z" fill="${INK}"/><path d="M43 64 V70 M50 64 V70 M57 64 V70" stroke="${INK}" stroke-width="2.5"/></svg>`,
    };
    const ICON = {
      lovebird: `<svg viewBox="0 0 100 100"><path d="${heart}" transform="translate(-6 -8) scale(1.12)" fill="#9e2f42" fill-opacity=".5" stroke="${INK}" stroke-width="8" stroke-linejoin="round"/></svg>`,
      cursed: BADGE.cursed.replace('id="bdx"', 'id="bdx2"').replaceAll('url(#bdx)', 'url(#bdx2)'),
    };
    for (const el of document.querySelectorAll('[data-mug]')) el.innerHTML = window.MUGSHOTS[el.dataset.mug] || '';
    for (const el of document.querySelectorAll('[data-badge]')) el.outerHTML = BADGE[el.dataset.badge];
    for (const el of document.querySelectorAll('[data-icon]')) el.outerHTML = ICON[el.dataset.icon];
  }
  renderVals() {
    const ROLES = {
      intruder: ['Intruder', 'SABOTEURS'], betrayer: ['Betrayer', 'DRINKERS'], forger: ['Forger', 'SABOTEURS'], medic: ['Medic', 'DRINKERS'],
      detective: ['Detective', 'DRINKERS'], lovebird: ['Lovebird', 'DRINKERS'], cursed: ['Cursed', 'DRINKERS'], skank: ['Skank', 'DRINKERS'],
      davyjones: ['Davy Jones', 'DRINKERS'], scrooge: ['Scrooge', 'CHAOS'], jester: ['Jester', 'CHAOS'], assassin: ['Assassin', 'SABOTEURS'],
      angel: ['Angel', 'DRINKERS'], drinker: ['Drinker', 'DRINKERS'],
    };
    // copied from src/lib/roles.ts CARD_TEXT / MODIFIER_TEXT
    const TEXT = {
      intruder: 'You are the INTRUDER. Stop the group reaching the target: hide beers, pour them away, slow everyone down. Guess a player\'s secret role on your phone to blow their cover. Keep guessing right and your knife stays sharp.',
      betrayer: 'You are the BETRAYER. An Intruder hides in this room and you want in. Accuse who you think it is from your phone; drinking earns more tries and a hint. Guess right, join the Saboteurs. Caught Intruder? Their knife is yours.',
      forger: 'You are the FORGER, working for the Saboteurs. When the Medic writes a heal, your phone knows. Forge it once and the saved victim still spins. Once a night you can frame a player too: the Detective will read them as a Saboteur.',
      medic: 'You are the MEDIC. Heal anyone from your phone before they spin and their punishment is cancelled, but never yourself. You start with one heal and unlock more as you drink. Beware: a Forger may be rewriting your work.',
      detective: 'You are the DETECTIVE. Once per game, quietly investigate a player from your phone. Sober, your readings are vague; the more you drink, the sharper they get. Each answer flashes for three seconds only. Trust nobody.',
      lovebird: 'You are a LOVEBIRD. Somewhere out there is your other half, and your phone will tell you exactly who. From now on you share everything: when one of you is punished, so is the other. You stay secret until your first punishment.',
      cursed: 'You are CURSED. Everyone can see the skull on your card, and every punishment you face is doubled because the wheel spins twice. Beat someone in a game and you can pass the curse on to them from your phone once the host approves.',
      skank: 'You are the SKANK, a lowly goblin on the Drinkers\' side. Nobody rates you, but every beer you log on your phone secretly counts double for the team, triple from 8 beers. The bonus is only revealed when time runs out.',
      scrooge: 'You are the SCROOGE. You serve no side and begrudge everyone their fun. From your phone you can force a re-spin of the wheel, swap the victim for someone else just before they spin, and scrawl your own punishment onto it.',
      jester: 'You are the JESTER. You serve no side and you WANT to be convicted. Act shifty and get the room to vote you out at a Trial: then you pick one of your accusers to take a triple punishment. Whoever laughs last, it\'s you.',
      davyjones: 'You are DAVY JONES. Once per game, drag someone down to your Locker from your phone to save them from the wheel. While they sleep with the fishes they skip punishments, but they lose their powers and their vote for a while.',
      assassin: 'You are the ASSASSIN, a Saboteur. Once per game, throw at someone from your phone: they must guess left, right or high to dodge, or go to the wheel. At 8 beers you become the NINJA and your shuriken can\'t be dodged.',
      angel: 'You are the ANGEL, watching over a room of drinkers. You never drink and you are never punished. Holy Nova adds a tenth of the target to the tally, and your blessing turns one wheel punishment into SAFE for the rest of the night.',
      drinker: 'You are a DRINKER. No tricks, no secret powers, just loyalty to the group and a thirst for victory. Keep the beers flowing, keep your eyes open, and watch for anyone hiding drinks or pouring them away. Unmask the Saboteurs.',
    };
    const codes = ['2RT-S7K', '2T8-765', 'K4P-9QX', 'M7D-3WN'];
    const keys = String(this.props.roles || 'betrayer,scrooge,jester,davyjones').split(',').map(s => s.trim()).filter(k => ROLES[k]).slice(0, 4);
    const love = this.props.lovebird === true, cursed = this.props.cursed === true;
    return {
      grayClass: this.props.gray === true ? 'gray' : '',
      site: 'localhost:5173',
      modLove: 'MODIFIER: LOVEBIRD. Your phone names your partner. You share every punishment, whatever your role.',
      modCursed: 'MODIFIER: CURSED. The TV shows your skull and every spin you face is doubled. Beat someone in a game to pass it on.',
      cards: keys.map((key, i) => {
        const lb = love && (i === 0 || i === 2), cu = cursed && (i === 0 || i === 1);
        return { key, label: ROLES[key][0].toUpperCase(), team: ROLES[key][1], text: TEXT[key], code: codes[i],
          lovebird: lb, cursed: cu, textClass: (lb || cu ? 'love' : '') + (lb && cu ? ' both' : '') };
      }),
    };
  }
}
</script>
</body>
</html>
