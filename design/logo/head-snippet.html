<!-- The Hundred: icons. Copy favicon.svg, favicon-16.png, favicon-32.png, apple-touch-icon.png,
     icon-192.png, icon-512.png and site.webmanifest from design/logo/ into public/, then add to <head>.
     PNGs carry explicit sizes and the SVG comes last so Chrome/Firefox/Edge pick the SVG; Safari uses the PNGs. -->
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="/favicon-16.png" type="image/png" sizes="16x16">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#07090b">
