<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Concept B: "Fill Line". A pint poured to a stencilled 100 mark: the goal as a measure. -->
  <defs>
    <linearGradient id="b-plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2226"/><stop offset="1" stop-color="#07090b"/>
    </linearGradient>
    <linearGradient id="b-beer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb866"/><stop offset=".5" stop-color="#ff8a1e"/><stop offset="1" stop-color="#c85e00"/>
    </linearGradient>
    <clipPath id="b-in"><path d="M18 10H46L42.4 54H21.6Z"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#b-plate)"/>
  <rect x=".5" y=".5" width="63" height="63" rx="13.5" fill="none" stroke="#28333a"/>
  <g clip-path="url(#b-in)">
    <rect x="0" y="20" width="64" height="40" fill="url(#b-beer)"/>
    <path d="M14 20C18 14 22 18 25 14S31 16 34 13S41 16 44 13S50 16 50 20Z" fill="#f1e8d4"/>
    <!-- measuring ticks, ink -->
    <g fill="#1b1712"><rect x="22" y="26" width="5" height="2"/><rect x="22" y="33" width="3" height="2"/><rect x="22" y="40" width="5" height="2"/><rect x="22" y="47" width="3" height="2"/></g>
  </g>
  <path d="M16 10H48L44 54Q43.6 56 41.6 56H22.4Q20.4 56 20 54Z" fill="none" stroke="#f1e8d4" stroke-width="3" stroke-linejoin="round"/>
  <!-- the 100 fill line: sodium rule running off the glass -->
  <rect x="10" y="19" width="38" height="2" fill="#ffe2b8"/>
  <rect x="47" y="14" width="14" height="12" rx="1.5" fill="#c2371f"/>
  <g fill="#f1e8d4" fill-rule="evenodd"><path d="M49 17h2v6h-2z"/><path d="M52 17h3.5v6H52zM53.2 18.2v3.6h1.1v-3.6z"/><path d="M56.5 17H60v6h-3.5zM57.7 18.2v3.6h1.1v-3.6z"/></g>
</svg>
